<div class="para" id="fig-spherical-element-tikz-2-1-1">Drag the background to rotate the picture, and use the three sliders to change <span class="process-math">\(d\rho\text{,}\)</span> <span class="process-math">\(d\theta\)</span> and <span class="process-math">\(d\phi\text{.}\)</span> None of the six faces of the wedge is flat: two are pieces of spheres, two are pieces of cones, and two are flat only because they are pieces of planes through the <span class="process-math">\(z\)</span>-axis.<div class="autopermalink" data-description="Paragraph"><a href="#fig-spherical-element-tikz-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para" id="fig-spherical-element-tikz-2-1-2">Now pull the three sliders down toward zero. As the increments become very small the curvature of those faces stops mattering, and the wedge can be thought of as a box with edges <span class="process-math">\(d\rho\text{,}\)</span> <span class="process-math">\(\rho\,d\phi\)</span> and <span class="process-math">\(\rho\sin\phi\,d\theta\text{.}\)</span> Multiplying those three edge lengths is exactly where <span class="process-math">\(dV = \rho^2\sin\phi\,d\rho\,d\phi\,d\theta\)</span> comes from.<div class="autopermalink" data-description="Paragraph"><a href="#fig-spherical-element-tikz-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
