<div class="para" id="interactive-wall-area-manim-1-1">The buttons “1 Surface”, “2 Base of the wall”, “3 Top of the wall” and “4 Slabs” build the picture in that order, and pressing a step again replays it. In step 3 a vertical segment from the floor up to the graph runs along <span class="process-math">\(C\)</span> and sweeps out the wall. In step 4 neighbouring points of <span class="process-math">\(C\)</span> are joined by chords and a flat slab stands on each; the arcs of <span class="process-math">\(C\)</span> show faintly through the slabs. Drag <span class="process-math">\(n\)</span> to change the number of slabs: the readout at the lower left gives the chord length <span class="process-math">\(\Delta s\)</span> beside the arc it replaces, compares the total area of the slabs with the area of the wall, and plots that total for every <span class="process-math">\(n\)</span> from 1 to 64 (click a point to jump to that <span class="process-math">\(n\)</span>). “Label a slab” marks one slab’s chord <span class="process-math">\(\Delta s\text{,}\)</span> its height and its area <span class="process-math">\(A_k\text{.}\)</span> “Play” runs a guided tour, dragging the figure turns it, “Spin” turns it on its own, and “Full screen” fills the screen with it.<div class="autopermalink" data-description="Paragraph"><a href="#interactive-wall-area-manim-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
