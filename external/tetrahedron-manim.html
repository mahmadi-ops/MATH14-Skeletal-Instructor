<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The tetrahedron bounded by x + 2y + z = 2, x = 2y, x = 0 and z = 0 -- face by face</title>
<!-- The animated companion of the tikz figure of Example III of "Double
     Integrals Over General Regions" (fig-tetrahedron-tikz): the same
     tetrahedron T, with vertices 0, (0,0,2), (0,1,0) and (1,1/2,0), whose
     four faces can be switched on one at a time, each in the colour of the
     plane it lies in.  "Whole planes" extends every face that is on to the
     part of its plane in the first octant, so that the four planes can be
     seen boxing T in; "Top view" looks straight down the z-axis, where T
     collapses onto its base, the region of integration.

     Same three.js stage, palette and controls as helix-manim.html and
     wall-area-manim.html, so the animated figures of the book read as one
     family. -->
<!-- The same two families the book itself loads (see pretext-html.xsl), so the
     figure's lettering matches the surrounding page rather than the reader's
     system UI font: Open Sans for text, PT Serif for the mathematics. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300..800&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
  /* Manim-style palette: dark stage, saturated accents, light serif math.
     Kept identical to the book's other animated figures. */
  :root {
    --bg:        #06070a;
    --panel:     #101218;
    --edge:      #262a36;
    --ink:       #ece6e2;   /* manim's off-white text */
    --dim:       #9aa0ad;
    --blue:      #58c4dd;   /* the slanted face x + 2y + z = 2 */
    --green:     #83c167;   /* the vertical face x = 2y */
    --violet:    #caa3e8;   /* the back face x = 0 */
    --yellow:    #ffe14d;   /* the base z = 0 */
    --red:       #fc6255;
    /* the book's own stacks */
    --sans:  "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: "PT Serif", "Times New Roman", Times, serif;
  }
  /* The figure is framed by the page at a fixed aspect ratio, so it lays out
     as a column that exactly fills the iframe: the panel takes what it needs
     and the stage takes the rest. In full screen the same column fills the
     screen instead. */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
               background: var(--bg); }
  body {
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #app { width: 100%; height: 100%; box-sizing: border-box;
         display: flex; flex-direction: column; }

  /* ---- stage ---- */
  #stage { position: relative; width: 100%; background: var(--bg);
           flex: 1 1 auto; min-height: 0; overflow: hidden; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }

  .overlay { position: absolute; pointer-events: none; }

  /* equation card, top-left, in the spirit of a manim MathTex on screen */
  #eqcard {
    top: 12px; left: 14px;
    padding: 9px 13px 10px 13px;
    background: rgba(16,18,24,0.72);
    border: 1px solid var(--edge);
    border-left: 3px solid var(--blue);
    border-radius: 6px;
    line-height: 1.45;
  }
  .math { font-family: var(--serif); font-size: 18px; }
  .math i, .var { font-style: italic; }
  .math b { font-weight: 700; }
  #cardTitle { font-size: 17px; }
  #cardTitle b { color: var(--ink); }
  #cardNone { font-size: 13px; color: var(--dim); }
  #faceList { margin: 2px 0 0 0; padding: 0; list-style: none; }
  #faceList li { display: flex; align-items: baseline; gap: 8px; font-size: 16px; }
  #faceList .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px;
                  flex: 0 0 auto; position: relative; top: 1px; }
  #faceList .where { font-size: 12.5px; color: var(--dim); font-family: var(--sans); }

  /* caption for the guided tour, bottom-centre, fades like a manim Write() */
  #caption {
    left: 50%; transform: translateX(-50%);
    bottom: 18px; max-width: 70%;
    text-align: center; font-size: 15px; line-height: 1.4;
    background: rgba(6,7,10,0.78);
    padding: 7px 14px; border-radius: 6px;
    opacity: 0; transition: opacity .45s ease;
  }
  #caption.show { opacity: 1; }
  #caption i { font-family: var(--serif); font-size: 16px; }

  /* ---- control panel ---- */
  #panel {
    flex: 0 0 auto;
    border-top: 1px solid var(--edge);
    background: var(--panel);
    padding: 9px 12px 11px 12px;
    box-sizing: border-box;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .row + .row { margin-top: 9px; }
  .lbl { font-size: 13px; color: var(--dim); }

  button {
    font: inherit; font-size: 13.5px;
    padding: 5px 12px; border-radius: 999px;
    color: var(--ink); background: #1a1d26;
    border: 1px solid var(--edge);
    cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  }
  button:hover { background: #232734; }
  button:disabled { opacity: .45; cursor: default; }
  button i { font-family: var(--serif); font-size: 15px; }
  /* a face button carries its face's colour as a dot; switched on, it is
     filled with that colour, the way the face itself lights up */
  .face::before {
    content: ""; display: inline-block; width: 9px; height: 9px;
    border-radius: 50%; background: var(--c); margin-right: 7px;
    vertical-align: 1px;
  }
  .face { border-color: #343947; }
  .face.on { background: var(--c); border-color: var(--c); color: #06070a; font-weight: 600; }
  .face.on::before { background: #06070a; }
  #btnTour.running { background: var(--blue); border-color: var(--blue); color: #06070a; font-weight: 600; }
  #btnPlanes.active { background: var(--ink); border-color: var(--ink); color: #06070a; font-weight: 600; }
  #btnTop.active   { background: var(--green); border-color: var(--green); color: #06070a; font-weight: 600; }
  #btnSpin.active  { background: var(--blue); border-color: var(--blue); color: #06070a; font-weight: 600; }
  #btnFull.active  { background: var(--violet); border-color: var(--violet); color: #06070a; font-weight: 600; }

  /* On a phone the equation card would cover most of the picture, so it stops
     floating and becomes a strip above the canvas instead. See resize(), which
     takes the strip's height out of the canvas rather than out of the solid. */
  @media (max-width: 560px) {
    #eqcard {
      position: static;
      padding: 7px 12px 8px 12px;
      border: none; border-bottom: 1px solid var(--edge);
      border-radius: 0; background: var(--panel);
      line-height: 1.35;
    }
    #cardTitle { font-size: 15px; }
    #faceList li { font-size: 14px; }
    #faceList .where { display: none; }     /* the buttons name the faces */
    #panel { padding: 7px 10px 8px 10px; }
    .row + .row { margin-top: 7px; }
    .lbl { display: none; }
    .long { display: none; }
    button { font-size: 13px; padding: 4px 10px; }
    button i { font-size: 14px; }
    #caption { font-size: 13px; max-width: 90%; bottom: 12px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="eqcard" class="overlay">
      <div class="math" id="cardTitle"><b><i>T</i></b>, bounded by the planes <i>x</i> + 2<i>y</i> + <i>z</i> = 2, &nbsp;<i>x</i> = 2<i>y</i>, &nbsp;<i>x</i> = 0, &nbsp;<i>z</i> = 0</div>
      <div id="cardNone">No face is on yet: press a face below, or Play.</div>
      <ul id="faceList" class="math"></ul>
    </div>

    <div id="caption" class="overlay"></div>
  </div>

  <div id="panel">
    <div class="row">
      <span class="lbl">Faces:</span>
      <button class="face" id="bf0" style="--c:#58c4dd" title="The slanted face, in the plane x + 2y + z = 2"><i>x</i> + 2<i>y</i> + <i>z</i> = 2</button>
      <button class="face" id="bf1" style="--c:#83c167" title="The vertical face through the z-axis, in the plane x = 2y"><i>x</i> = 2<i>y</i></button>
      <button class="face" id="bf2" style="--c:#caa3e8" title="The back face, in the yz-plane x = 0"><i>x</i> = 0</button>
      <button class="face" id="bf3" style="--c:#ffe14d" title="The base, in the xy-plane z = 0"><i>z</i> = 0</button>
      <button id="btnAll" title="Switch every face on">All</button>
      <button id="btnNone" title="Switch every face off">None</button>
    </div>
    <div class="row">
      <button id="btnTour" aria-label="Play the guided tour" title="A guided tour: the four faces one at a time, the whole planes, and the view from above">&#9654;<span class="long">&nbsp;Play</span></button>
      <button id="btnPlanes" title="Extend each face that is on to the part of its plane in the first octant">Whole planes</button>
      <button id="btnTop" title="Look straight down the z-axis: T collapses onto its base">&#8615;<span class="long">&nbsp;Top view</span></button>
      <button id="btnSpin">Spin</button>
      <span style="flex:1"></span>
      <button id="btnFull" aria-label="Full screen" title="Show the figure full screen">&#x26F6;<span class="long">&nbsp;Full screen</span></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // Manim colour constants, so the palette below reads the way a Scene would.
  var BLUE_C = 0x58c4dd, GREEN_C = 0x83c167, YELLOW = 0xffe14d, PURPLE_A = 0xcaa3e8,
      GREY = 0x8a8f9c, INK = 0xece6e2;

  // ---------- the solid ----------
  // vertices: O(0,0,0), A(0,0,2), B(0,1,0), C(1,1/2,0), as in the tikz figure
  var O = new THREE.Vector3(0, 0, 0), A = new THREE.Vector3(0, 0, 2),
      B = new THREE.Vector3(0, 1, 0), C = new THREE.Vector3(1, 0.5, 0);
  // how far the whole planes, the floor and the axes reach
  var XMAX = 2.0, YMAX = 1.25, ZTOP = 2.3;

  // Each face: its equation, its colour, its three vertices, the part of its
  // plane in the first octant (shown by "Whole planes"), where its label sits
  // in the orbiting view and in the top view, and what the card says of it.
  var FACES = [
    { eq: "x + 2y + z = 2", css: "#58c4dd", hex: BLUE_C, tri: [A, B, C],
      plane: [new THREE.Vector3(XMAX, 0, 0), B, A],
      where: "the slanted roof, through (0,0,2), (0,1,0) and (1,½,0)",
      pos: [0.35, 0.5, 0.95], ctr: [0.5, 0.5],
      topPos: [0.57, 0.82, 0], topCtr: [0, 0] },
    { eq: "x = 2y", css: "#83c167", hex: GREEN_C, tri: [O, A, C],
      plane: [O, new THREE.Vector3(XMAX, 0.5 * XMAX, 0),
              new THREE.Vector3(XMAX, 0.5 * XMAX, ZTOP), new THREE.Vector3(0, 0, ZTOP)],
      where: "a vertical wall through the z-axis, 0, (0,0,2) and (1,½,0)",
      pos: [0.5, -0.02, 0.6], ctr: [1, 0.5],
      topPos: [0.58, 0.2, 0], topCtr: [0, 1] },
    { eq: "x = 0", css: "#caa3e8", hex: PURPLE_A, tri: [O, A, B],
      plane: [O, new THREE.Vector3(0, YMAX, 0),
              new THREE.Vector3(0, YMAX, ZTOP), new THREE.Vector3(0, 0, ZTOP)],
      where: "the back wall, the yz-plane, through 0, (0,0,2) and (0,1,0)",
      pos: [0, 0.62, 0.3], ctr: [0.5, 0.5],
      topPos: [-0.06, 0.5, 0], topCtr: [1, 0.5] },
    { eq: "z = 0", css: "#ffe14d", hex: YELLOW, tri: [O, B, C],
      plane: [O, new THREE.Vector3(XMAX, 0, 0),
              new THREE.Vector3(XMAX, YMAX, 0), new THREE.Vector3(0, YMAX, 0)],
      where: "the floor: T stands on the triangle 0, (0,1,0), (1,½,0)",
      pos: [0.3, 0.52, 0], ctr: [0.5, 0.5],
      topPos: [0.34, 0.5, 0], topCtr: [0.5, 0.5] }
  ];

  // ---------- renderer / scene ----------
  var stage = document.getElementById("stage");
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x06070a);

  var camera = new THREE.PerspectiveCamera(36, 1, 0.1, 200);
  camera.up.set(0, 0, 1);                 // z is up, the usual maths convention

  // The top view looks straight down the z-axis through an orthographic camera,
  // so that the solid lands exactly on its base: with perspective the top
  // vertex, being nearer the eye, would come out off-centre.
  var ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
  var topView = false;
  var TOP_CX = 1.05, TOP_CY = 0.85;      // the middle of the floor as drawn, labels included
  var TOP_HW = 1.8, TOP_HH = 1.32;       // its half-extents, axis tips and labels included
  var padPx = 0, canvasH = 1;            // set by resize(): the overlays' vertical offset, the canvas height

  // The orbiting camera is framed on a cloud of the picture's extreme points
  // (axis tips and labels, the corners of the whole planes), measured once in
  // fitScene() below, so that everything stays in frame from every angle and
  // nothing jumps when the planes are switched on.
  var CENTER = new THREE.Vector3(0.6, 0.5, 0.9);
  // ...measured twice: without the planes (FIT_T) and with them (FIT_P); the
  // camera eases from the one framing to the other as the planes come and go.
  var FIT_T = null, FIT_P = null;
  // Roughly the tikz figure's viewpoint (view={97}{20}): the x-axis comes
  // toward the viewer and a little to the left, the y-axis runs to the right.
  var radius = 8, theta = 0.2, phi = 1.2;
  var aimShift = 0;   // world units to slide the picture down the screen
  var band = 1, aspect = 1;   // set by resize(): the clear strip under the card

  // The smallest camera distance that still shows every sampled point: for a
  // point at depth (radius - d.e) the frustum is tanV wide, so each point sets a
  // lower bound on the distance and the largest of those bounds wins. Recomputed
  // as the camera moves, so the picture stays whole from every angle.
  var _e = new THREE.Vector3(), _up = new THREE.Vector3(), _rt = new THREE.Vector3();
  function computeRadius() {
    _e.set(Math.sin(phi) * Math.cos(theta), Math.sin(phi) * Math.sin(theta), Math.cos(phi));
    _up.set(0, 0, 1).addScaledVector(_e, -_e.z);
    if (_up.lengthSq() < 1e-9) _up.set(0, 1, 0); else _up.normalize();
    _rt.crossVectors(_up, _e).normalize();

    var tanHalf = Math.tan(camera.fov * Math.PI / 360);
    var tanV = tanHalf * band, tanH = tanHalf * aspect;
    function bound(fit) {
      var rr = 1;
      for (var i = 0; i < fit.cloud.length; i++) {
        var d = fit.cloud[i], along = d.dot(_e);
        rr = Math.max(rr, along + Math.abs(d.dot(_up)) / tanV,
                          along + Math.abs(d.dot(_rt)) / tanH);
      }
      return rr;
    }
    var rT = bound(FIT_T), rP = bound(FIT_P);
    radius = 1.04 * (rT + (rP - rT) * planeAlpha);
    CENTER.copy(FIT_T.center).lerp(FIT_P.center, planeAlpha);
    camera.far = 2.2 * radius + 10;
    camera.updateProjectionMatrix();
  }

  function placeCamera() {
    computeRadius();
    var eye = new THREE.Vector3(
      radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.sin(phi) * Math.sin(theta),
      radius * Math.cos(phi)
    );
    // Screen-up in world terms: camera.up with the view direction projected out.
    var fwd = eye.clone().negate().normalize();
    var up = camera.up.clone().addScaledVector(fwd, -camera.up.dot(fwd));
    if (up.lengthSq() < 1e-9) up.set(0, 1, 0);
    up.normalize().multiplyScalar(aimShift);

    camera.position.copy(eye).add(up).add(CENTER);
    var look = up.clone().add(CENTER);
    camera.lookAt(look.x, look.y, look.z);
  }

  function placeTop() {
    var halfH = TOP_HH / band, halfW = halfH * aspect;
    if (halfW < TOP_HW) { halfW = TOP_HW; halfH = halfW / aspect; }
    var shift = padPx * 2 * halfH / canvasH;   // centre the picture in the clear band
    ortho.left = -halfW; ortho.right = halfW;
    ortho.top = halfH + shift; ortho.bottom = -halfH + shift;
    ortho.position.set(TOP_CX, TOP_CY, 30);
    ortho.up.set(0, 1, 0);                    // x to the right, y up: the xy-plane as drawn
    ortho.lookAt(TOP_CX, TOP_CY, 0);
    ortho.updateProjectionMatrix();
  }

  // ---------- text sprites (axis, vertex and face labels) ----------
  // Drawn in the book's serif, variables in italic and everything else upright.
  // The webfont may still be loading when the sprites are first painted, so
  // they are repainted once document.fonts settles.
  var FONT_IT = 'italic 78px "PT Serif", "Times New Roman", Times, serif';
  var FONT_UP = '78px "PT Serif", "Times New Roman", Times, serif';
  var LABELS = [];

  // "x + 2y + z = 2" -> the letters x, y, z, T in italic, the rest upright
  function runsOf(text) {
    var runs = [], re = /[xyzT]/g, last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) runs.push({ t: text.slice(last, m.index), i: false });
      runs.push({ t: m[0], i: true });
      last = m.index + 1;
    }
    if (last < text.length) runs.push({ t: text.slice(last), i: false });
    return runs;
  }

  function paintLabel(rec) {
    var s = 128, pad = 14, cv = document.createElement("canvas");
    var g = cv.getContext("2d");
    var runs = runsOf(rec.text), w = 0;
    runs.forEach(function (r) { g.font = r.i ? FONT_IT : FONT_UP; w += g.measureText(r.t).width; });
    var W = Math.ceil(w) + 2 * pad;
    cv.width = W; cv.height = s;
    g = cv.getContext("2d");
    g.fillStyle = rec.color;
    g.textAlign = "left";
    g.textBaseline = "middle";
    var x = pad;
    runs.forEach(function (r) {
      g.font = r.i ? FONT_IT : FONT_UP;
      g.fillText(r.t, x, s / 2);
      x += g.measureText(r.t).width;
    });
    var tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter;
    if (rec.sprite.material.map) rec.sprite.material.map.dispose();
    rec.sprite.material.map = tex;
    rec.sprite.material.needsUpdate = true;
    rec.sprite.scale.set(rec.size * W / s, rec.size, 1);
  }

  function makeLabel(text, cssColor, size) {
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
      transparent: true, depthTest: false
    }));
    sp.renderOrder = 10;      // painted after the translucent faces, never dimmed by them
    var rec = { sprite: sp, text: text, color: cssColor, size: size || 0.5 };
    LABELS.push(rec);
    paintLabel(rec);
    return sp;
  }

  // ---------- axes, with manim-ish arrow tips ----------
  var Z_PARTS = [];
  (function buildAxes() {
    var mat = new THREE.LineBasicMaterial({ color: GREY, transparent: true, opacity: 0.55 });
    var tipMat = new THREE.MeshBasicMaterial({ color: GREY, transparent: true, opacity: 0.75 });
    var dirs = [
      { v: new THREE.Vector3(1, 0, 0), rot: [0, 0, -Math.PI / 2], t: "x", lo: -0.15, hi: XMAX + 0.35 },
      { v: new THREE.Vector3(0, 1, 0), rot: [0, 0, 0],            t: "y", lo: -0.15, hi: YMAX + 0.35 },
      { v: new THREE.Vector3(0, 0, 1), rot: [Math.PI / 2, 0, 0],  t: "z", lo: -0.15, hi: ZTOP + 0.35 }
    ];
    dirs.forEach(function (d) {
      var a = d.v.clone().multiplyScalar(d.lo), b = d.v.clone().multiplyScalar(d.hi);
      scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), mat));
      var tip = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.17, 14), tipMat);
      tip.position.copy(b);
      tip.rotation.set(d.rot[0], d.rot[1], d.rot[2]);
      scene.add(tip);
      var lab = makeLabel(d.t, "#9aa0ad", 0.36);
      lab.position.copy(d.v.clone().multiplyScalar(d.hi + 0.22));
      scene.add(lab);
      // seen from straight above, the z-axis is a point at the origin, and its
      // tip and label would only sit on top of the vertex there
      if (d.t === "z") Z_PARTS.push(tip, lab);
    });
  })();

  // ---------- the floor z = 0, a faint checkerboard, the way manim draws a plane ----------
  (function buildFloor() {
    var cell = 0.25, nx = Math.round(XMAX / cell), ny = Math.round(YMAX / cell), pos = [], col = [];
    var cA = new THREE.Color(0x1c2230), cB = new THREE.Color(0x141924);
    for (var j = 0; j < ny; j++) {
      for (var i = 0; i < nx; i++) {
        var x0 = cell * i, x1 = x0 + cell, y0 = cell * j, y1 = y0 + cell;
        [[x0, y0], [x1, y0], [x1, y1], [x0, y0], [x1, y1], [x0, y1]].forEach(function (p) {
          pos.push(p[0], p[1], -0.004);
        });
        var cc = ((i + j) % 2 === 0) ? cA : cB;
        for (var k = 0; k < 6; k++) col.push(cc.r, cc.g, cc.b);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      vertexColors: true, transparent: true, opacity: 0.55,
      side: THREE.DoubleSide, depthWrite: false
    })));
  })();

  // ---------- the bare edges of T: always there, faintly, so the solid can be
  //            made out before any face is on ----------
  (function buildWire() {
    var pts = [O, A, O, B, O, C, A, B, A, C, B, C];
    scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: GREY, transparent: true, opacity: 0.6 })));
  })();

  // ---------- the vertices and their labels ----------
  var TOP_HIDE = [];   // what the top view puts away
  (function buildVertices() {
    var dotMat = new THREE.MeshBasicMaterial({ color: INK });
    [A, B, C].forEach(function (P) {
      var s = new THREE.Mesh(new THREE.SphereGeometry(0.032, 18, 18), dotMat);
      s.position.copy(P); scene.add(s);
    });
    var la = makeLabel("(0, 0, 2)", "#ece6e2", 0.3);
    la.center.set(0, 0.4); la.position.set(0, 0.07, 2.07); scene.add(la);
    TOP_HIDE.push(la);     // from above it lands on the origin, under the 0
    var lb = makeLabel("(0, 1, 0)", "#ece6e2", 0.3);
    lb.center.set(0, 0.35); lb.position.set(0, 1.06, 0.05); scene.add(lb);
    var lc = makeLabel("(1, ½, 0)", "#ece6e2", 0.3);
    lc.center.set(0.5, 1); lc.position.set(1.02, 0.5, -0.1); scene.add(lc);
    var lo = makeLabel("0", "#ece6e2", 0.3);
    lo.center.set(1, 1); lo.position.set(0, -0.05, -0.05); scene.add(lo);
  })();

  // ---------- the four faces ----------
  // Each face is a group: the translucent triangle, three bright edges, and
  // its label; and a second group, the part of its plane in the first octant
  // with a dashed outline, for "Whole planes". Both fade in and out with the
  // face's alpha, which frame() eases toward 0 or 1.
  var FACE_OPACITY = 0.46, PLANE_OPACITY = 0.17;

  function triMesh(pts, hex, opacity) {
    var geo = new THREE.BufferGeometry();
    var arr = [];
    // a triangle, or a quad as two triangles
    var idx = pts.length === 3 ? [0, 1, 2] : [0, 1, 2, 0, 2, 3];
    idx.forEach(function (k) { arr.push(pts[k].x, pts[k].y, pts[k].z); });
    geo.setAttribute("position", new THREE.Float32BufferAttribute(arr, 3));
    var mat = new THREE.MeshBasicMaterial({
      color: hex, transparent: true, opacity: opacity,
      side: THREE.DoubleSide, depthWrite: false
    });
    return new THREE.Mesh(geo, mat);
  }

  function edgeTube(a, b, hex, rad) {
    var geo = new THREE.TubeGeometry(new THREE.LineCurve3(a, b), 2, rad, 10, false);
    return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: hex, transparent: true, opacity: 1 }));
  }

  var faces = FACES.map(function (F, k) {
    var g = new THREE.Group(), mats = [];
    var tri = triMesh(F.tri, F.hex, FACE_OPACITY);
    g.add(tri); mats.push({ m: tri.material, base: FACE_OPACITY });
    // the three edges, each face's tubes a hair thicker than the last so two
    // faces sharing an edge do not flicker against each other
    var rad = 0.012 + 0.0015 * k;
    [[0, 1], [1, 2], [2, 0]].forEach(function (e) {
      var t = edgeTube(F.tri[e[0]], F.tri[e[1]], F.hex, rad);
      g.add(t); mats.push({ m: t.material, base: 1 });
    });
    var lab = makeLabel(F.eq, F.css, 0.3);
    lab.center.set(F.ctr[0], F.ctr[1]);
    lab.position.set(F.pos[0], F.pos[1], F.pos[2]);
    g.add(lab); mats.push({ m: lab.material, base: 1 });
    g.visible = false;
    scene.add(g);

    var pg = new THREE.Group(), pmats = [];
    var sheet = triMesh(F.plane, F.hex, PLANE_OPACITY);
    pg.add(sheet); pmats.push({ m: sheet.material, base: PLANE_OPACITY });
    var outline = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(F.plane),
      new THREE.LineDashedMaterial({ color: F.hex, dashSize: 0.08, gapSize: 0.05,
                                     transparent: true, opacity: 0.8 }));
    outline.computeLineDistances();
    pg.add(outline); pmats.push({ m: outline.material, base: 0.8 });
    pg.visible = false;
    scene.add(pg);

    return { F: F, on: false, alpha: 0, group: g, mats: mats,
             pgroup: pg, pmats: pmats, label: lab,
             btn: document.getElementById("bf" + k) };
  });

  var planesOn = false, planeAlpha = 0;

  function applyAlphas() {
    faces.forEach(function (f) {
      var a = f.alpha;
      f.mats.forEach(function (r) { r.m.opacity = r.base * a; });
      f.group.visible = a > 0.002;
      var pa = a * planeAlpha;
      f.pmats.forEach(function (r) { r.m.opacity = r.base * pa; });
      f.pgroup.visible = pa > 0.002;
    });
  }

  // ---------- the card: which faces are on ----------
  var elList = document.getElementById("faceList"), elNone = document.getElementById("cardNone");
  function eqHTML(eq) {
    return eq.replace(/[xyzT]/g, function (c) { return "<i>" + c + "</i>"; });
  }
  function updateCard() {
    var html = "", any = false;
    faces.forEach(function (f) {
      if (!f.on) return;
      any = true;
      html += '<li><span class="sw" style="background:' + f.F.css + '"></span>' +
              '<span style="color:' + f.F.css + '">' + eqHTML(f.F.eq) + '</span>' +
              '<span class="where">' + f.F.where + '</span></li>';
    });
    elList.innerHTML = html;
    elNone.style.display = any ? "none" : "";
    window.setTimeout(resize, 0);   // the card changed height
  }

  function setFace(k, on, instant) {
    var f = faces[k];
    f.on = on;
    f.btn.classList.toggle("on", on);
    if (instant) { f.alpha = on ? 1 : 0; applyAlphas(); }
    updateCard();
    ensureLoop();
  }
  function setPlanes(on) {
    planesOn = on;
    document.getElementById("btnPlanes").classList.toggle("active", on);
    ensureLoop();
  }

  // ---------- render loop ----------
  var spinning = false, rafId = null, lastT = 0;
  var FADE = 0.45;   // seconds for a face to come up or go down

  function render() { renderer.render(scene, topView ? ortho : camera); }

  function frame(now) {
    rafId = requestAnimationFrame(frame);
    var dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0;
    lastT = now;
    var dirty = false, busy = false;

    if (spinning || tour.running) {
      theta += (tour.running ? 0.08 : 0.22) * dt;
      placeCamera();
      dirty = true;
    }
    // ease every alpha toward its target
    var step = dt / FADE;
    faces.forEach(function (f) {
      var target = f.on ? 1 : 0;
      if (f.alpha !== target) {
        f.alpha = f.alpha < target ? Math.min(target, f.alpha + step) : Math.max(target, f.alpha - step);
        dirty = true; busy = busy || f.alpha !== target;
      }
    });
    var pt = planesOn ? 1 : 0;
    if (planeAlpha !== pt) {
      planeAlpha = planeAlpha < pt ? Math.min(pt, planeAlpha + step) : Math.max(pt, planeAlpha - step);
      placeCamera();
      dirty = true; busy = busy || planeAlpha !== pt;
    }
    if (dirty) { applyAlphas(); render(); }

    if (!spinning && !tour.running && !busy) { cancelAnimationFrame(rafId); rafId = null; lastT = 0; }
  }
  function ensureLoop() { if (rafId === null) { lastT = 0; rafId = requestAnimationFrame(frame); } }

  // ---------- the guided tour: a little Scene, played in the browser ----------
  var elCaption = document.getElementById("caption");
  function say(html) {
    elCaption.classList.remove("show");
    window.setTimeout(function () {
      elCaption.innerHTML = html;
      elCaption.classList.add("show");
    }, html ? 160 : 0);
  }

  // faces: which are on after the beat (0 roof, 1 x = 2y, 2 x = 0, 3 floor)
  var STORY = [
    { say: "<i>T</i> is cut out by four planes. To begin, only its six edges are drawn.",
      faces: [], planes: false, hold: 2.6 },
    { say: "<i>z</i> = 0, the <i>xy</i>-plane, is the floor: <i>T</i> stands on the triangle with vertices 0, (0,1,0) and (1,&frac12;,0). That triangle is the region of integration.",
      faces: [3], hold: 3.8 },
    { say: "<i>x</i> = 0, the <i>yz</i>-plane, is the back wall, through 0, (0,0,2) and (0,1,0).",
      faces: [3, 2], hold: 3.0 },
    { say: "<i>x</i> = 2<i>y</i> is a vertical plane through the <i>z</i>-axis: the other wall, through 0, (0,0,2) and (1,&frac12;,0).",
      faces: [3, 2, 1], hold: 3.2 },
    { say: "<i>x</i> + 2<i>y</i> + <i>z</i> = 2 is the slanted roof. It passes through (0,0,2), (0,1,0) and (1,&frac12;,0), and <i>T</i> is everything under it, over the floor triangle.",
      faces: [3, 2, 1, 0], hold: 3.8 },
    { say: "Each face is only a piece of its plane: here are the four planes themselves, boxing <i>T</i> in.",
      faces: [3, 2, 1, 0], planes: true, hold: 3.6 },
    { say: "Seen from straight above, <i>T</i> collapses onto its base. The two slanted sides of the base are where the walls <i>x</i> = 2<i>y</i> and <i>x</i> + 2<i>y</i> + <i>z</i> = 2 meet the floor.",
      faces: [3, 2, 1, 0], planes: false, view: "top", hold: 4.2 },
    { say: "Your turn: switch the faces on and off, extend them to whole planes, or drag the figure to look from anywhere.",
      faces: [3, 2, 1, 0], view: "orbit", hold: 1.2 }
  ];

  var tour = { running: false, i: 0, timer: null, top: false };
  var btnTour = document.getElementById("btnTour");

  function tourStep() {
    if (!tour.running) return;
    if (tour.i >= STORY.length) { stopTour(); return; }
    var beat = STORY[tour.i++];
    if (beat.view === "top") { tour.top = true; setTopView(true); }
    else if (beat.view === "orbit" && tour.top) { tour.top = false; setTopView(false); }
    if (beat.planes !== undefined) setPlanes(beat.planes);
    faces.forEach(function (f, k) { setFace(k, beat.faces.indexOf(k) >= 0); });
    say(beat.say);
    tour.timer = window.setTimeout(tourStep, beat.hold * 1000);
  }
  function startTour() {
    tour.running = true; tour.i = 0;
    btnTour.innerHTML = "&#10074;&#10074;<span class=\"long\">&nbsp;Stop</span>";
    btnTour.classList.add("running");
    ensureLoop();
    tourStep();
  }
  function stopTour() {
    tour.running = false;
    if (tour.timer) { window.clearTimeout(tour.timer); tour.timer = null; }
    if (tour.top) { tour.top = false; setTopView(false); }
    btnTour.innerHTML = "&#9654;<span class=\"long\">&nbsp;Play</span>";
    btnTour.classList.remove("running");
    say("");
    ensureLoop();
  }
  btnTour.addEventListener("click", function () { tour.running ? stopTour() : startTour(); });

  // ---------- drag to orbit ----------
  var dragging = false, lastX = 0, lastY = 0;
  var el = renderer.domElement;
  function startDrag(x, y) { dragging = true; lastX = x; lastY = y; }
  function moveDrag(x, y) {
    if (!dragging) return;
    if (topView) leaveTopView();   // dragging the picture takes it out of the top view
    theta -= (x - lastX) * 0.008;
    phi = Math.min(Math.PI - 0.05, Math.max(0.05, phi - (y - lastY) * 0.008));
    lastX = x; lastY = y;
    placeCamera();
    render();
  }
  el.addEventListener("mousedown", function (e) { startDrag(e.clientX, e.clientY); });
  window.addEventListener("mousemove", function (e) { moveDrag(e.clientX, e.clientY); });
  window.addEventListener("mouseup", function () { dragging = false; });
  el.addEventListener("touchstart", function (e) {
    if (e.touches.length === 1) { startDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, { passive: false });
  el.addEventListener("touchmove", function (e) {
    if (e.touches.length === 1) { moveDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, { passive: false });
  window.addEventListener("touchend", function () { dragging = false; });

  // ---------- controls ----------
  faces.forEach(function (f, k) {
    f.btn.addEventListener("click", function () {
      if (tour.running) stopTour();
      setFace(k, !f.on);
    });
  });
  document.getElementById("btnAll").addEventListener("click", function () {
    if (tour.running) stopTour();
    faces.forEach(function (f, k) { setFace(k, true); });
  });
  document.getElementById("btnNone").addEventListener("click", function () {
    if (tour.running) stopTour();
    faces.forEach(function (f, k) { setFace(k, false); });
  });
  document.getElementById("btnPlanes").addEventListener("click", function () {
    if (tour.running) stopTour();
    setPlanes(!planesOn);
  });

  var btnSpin = document.getElementById("btnSpin");
  btnSpin.addEventListener("click", function () {
    spinning = !spinning;
    btnSpin.classList.toggle("active", spinning);
    if (spinning) { if (topView) leaveTopView(); ensureLoop(); }
  });

  // ---------- top view: straight down the z-axis, onto the base ----------
  // A cut rather than a camera move, the way manim would switch scenes: the
  // orbiting view is put away and the orthographic camera takes over. Pressing
  // the button again, or dragging the picture, brings the old viewpoint back.
  var btnTop = document.getElementById("btnTop");
  var topHint = null;
  function setTopView(on) {
    if (on === topView) return;
    topView = on;
    btnTop.classList.toggle("active", on);
    Z_PARTS.forEach(function (o) { o.visible = !on; });
    TOP_HIDE.forEach(function (o) { o.visible = !on; });
    // the face labels move to where they read best from above: beside the
    // edge of the base that their plane cuts out
    faces.forEach(function (f) {
      var F = f.F, p = on ? F.topPos : F.pos, c = on ? F.topCtr : F.ctr;
      f.label.position.set(p[0], p[1], p[2]);
      f.label.center.set(c[0], c[1]);
    });
    if (on) {
      if (spinning) { spinning = false; btnSpin.classList.remove("active"); }
      placeTop();
    } else {
      if (topHint) { window.clearTimeout(topHint); topHint = null; say(""); }
      placeCamera();
    }
    render();
  }
  function leaveTopView() { setTopView(false); }
  btnTop.addEventListener("click", function () {
    if (tour.running) stopTour();
    setTopView(!topView);
    if (topView) {
      say("Straight down the <i>z</i>-axis: <i>T</i> collapses onto its base, the region of integration.");
      topHint = window.setTimeout(function () { say(""); topHint = null; }, 3600);
    }
  });

  // ---------- full screen ----------
  // The figure lives in an iframe, so the request is only honoured when the
  // embedding iframe carries allowfullscreen (custom-html.xsl adds it). Where
  // it is refused anyway, iOS Safari for one, the page opens on its own in a
  // new tab instead, which is the next best thing.
  var btnFull = document.getElementById("btnFull");
  var docEl = document.documentElement;
  function fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  function openStandalone() { window.open(window.location.href, "_blank", "noopener"); }
  btnFull.addEventListener("click", function () {
    if (fsElement()) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      return;
    }
    var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
    if (!req) { openStandalone(); return; }
    try {
      var p = req.call(docEl);
      if (p && p.catch) p.catch(openStandalone);
    } catch (e) { openStandalone(); }
  });
  function onFsChange() {
    var on = !!fsElement();
    btnFull.classList.toggle("active", on);
    btnFull.innerHTML = on ? "&#x26F6;<span class=\"long\">&nbsp;Exit full screen</span>"
                           : "&#x26F6;<span class=\"long\">&nbsp;Full screen</span>";
    // the stage changes size with the window; give the layout a tick to settle
    window.setTimeout(resize, 50);
  }
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);

  // ---------- what has to fit on screen ----------
  // The extreme points of the picture: the axis tips with their labels, the
  // corners of the whole planes (so switching them on moves nothing), and the
  // vertex labels. Measured once; the planes are part of it whether on or not.
  function fitScene() {
    var pts = [], box = new THREE.Box3();
    scene.traverse(function (o) {
      if (o.visible === false) return;
      if (o.isSprite) {                          // a sprite is a billboard rectangle
        var kx = 0.5 * o.scale.x, kz = 0.5 * o.scale.y;
        [[kx, kz], [-kx, -kz]].forEach(function (dd) {
          pts.push(new THREE.Vector3(o.position.x + dd[0], o.position.y + dd[0],
                                     o.position.z + dd[1]));
        });
        return;
      }
      var at = o.geometry && o.geometry.getAttribute && o.geometry.getAttribute("position");
      if (!at) return;
      var step = Math.max(1, Math.floor(at.count / 400));
      for (var i = 0; i < at.count; i += step) {
        pts.push(new THREE.Vector3(at.getX(i), at.getY(i), at.getZ(i)).applyMatrix4(o.matrixWorld));
      }
    });
    pts.forEach(function (p) { box.expandByPoint(p); });
    var c = new THREE.Vector3();
    box.getCenter(c);
    return { center: c, cloud: pts.map(function (p) { return p.clone().sub(c); }) };
  }

  // ---------- sizing (fills the iframe, or the screen) ----------
  // The equation card is drawn over the canvas, so the picture is framed into
  // the clear band below it rather than into the whole canvas. That keeps the
  // two from colliding on a narrow phone as well as on a wide screen.
  function resize() {
    var w = document.getElementById("app").clientWidth;
    // the stage is the flex column's leftover space, so it is measured,
    // not computed: no rounding is left over to make a scrollbar
    var h = stage.clientHeight;

    var card = document.getElementById("eqcard");
    // Below 560px the card is a strip above the canvas (see the media query), so it
    // costs canvas height instead of covering the picture.
    var stacked = window.getComputedStyle(card).position === "static";
    var cardH = stacked ? card.offsetHeight : 0;
    var ch = Math.max(120, h - cardH);

    renderer.setSize(w, ch);
    camera.aspect = w / ch;

    // How much vertical room the floating card really costs depends on how far it
    // reaches across: spanning the width, the picture must clear it entirely;
    // hugging the left edge of a wide screen, it barely intrudes.
    var reach = Math.min(1, card.offsetWidth / (0.45 * w));
    var topPad = stacked ? 0 : (card.offsetHeight + 16) * reach;
    var botPad = 10;
    // leave at least half of the canvas for the picture, however tall the card is
    band = Math.max(0.5, (ch - topPad - botPad) / ch);
    aspect = camera.aspect;
    computeRadius();

    // slide the picture into the middle of that band
    var tanHalf = Math.tan(camera.fov * Math.PI / 360);
    padPx = 0.5 * (topPad - botPad); canvasH = ch;
    aimShift = padPx * (2 * radius * tanHalf) / ch;

    placeCamera();
    placeTop();
    render();
  }
  window.addEventListener("resize", resize);

  // ---------- go ----------
  // Every piece is measured for the framing, so the faces, and then the
  // planes too, are shown while fitScene() samples them, then put away again.
  // (A group's visibility hides its children from traverse() here: see the
  // visible test in fitScene().)
  faces.forEach(function (f) { f.group.visible = true; f.pgroup.visible = false; });
  scene.updateMatrixWorld(true);
  FIT_T = fitScene();
  faces.forEach(function (f) { f.pgroup.visible = true; });
  FIT_P = fitScene();
  applyAlphas();
  updateCard();
  resize();

  // the webfont arrives after the first paint: redo the lettering in it
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      LABELS.forEach(paintLabel);
      render();
    });
  }
})();
</script>
</body>
</html>
