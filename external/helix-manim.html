<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The helix r(t) = (cos 2t, sin 2t, t) -- animated</title>
<!-- The same two families the book itself loads (see pretext-html.xsl), so the
     figure's lettering matches the surrounding page rather than the reader's
     system UI font: Open Sans for text, PT Serif for the mathematics. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300..800&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
  /* Manim-style palette: dark stage, saturated accents, light serif math.
     Kept identical to the animated figures of the MATH 13 book
     (conic-slicer-manim.html and its siblings) so the two books read as one
     family. */
  :root {
    --bg:        #06070a;
    --panel:     #101218;
    --edge:      #262a36;
    --ink:       #ece6e2;   /* manim's off-white text */
    --dim:       #9aa0ad;
    --blue:      #58c4dd;
    --green:     #83c167;
    --yellow:    #ffe14d;
    --red:       #fc6255;
    --gold:      #f0ac5f;
    --violet:    #caa3e8;   /* manim PURPLE_A: the position vector */
    /* the book's own stacks */
    --sans:  "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: "PT Serif", "Times New Roman", Times, serif;
  }
  /* The figure is framed by the page at a fixed aspect ratio, so it lays out
     as a column that exactly fills the iframe: the panel takes what it needs
     and the stage takes the rest. In full screen the same column fills the
     screen instead. */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
               background: var(--bg); }
  body {
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #app { width: 100%; height: 100%; box-sizing: border-box;
         display: flex; flex-direction: column; }

  /* ---- stage ---- */
  #stage { position: relative; width: 100%; background: var(--bg);
           flex: 1 1 auto; min-height: 0; overflow: hidden; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }

  .overlay { position: absolute; pointer-events: none; }

  /* equation card, top-left, in the spirit of a manim MathTex on screen */
  #eqcard {
    top: 12px; left: 14px;
    padding: 9px 13px 10px 13px;
    background: rgba(16,18,24,0.72);
    border: 1px solid var(--edge);
    border-left: 3px solid var(--blue);
    border-radius: 6px;
    line-height: 1.45;
  }
  .math { font-family: var(--serif); font-size: 18px; }
  .math i, .var { font-style: italic; }
  .math b { font-weight: 700; }
  #pointLine {
    font-size: 17px; font-weight: 600; letter-spacing: .2px;
    font-family: var(--serif);
    font-variant-numeric: tabular-nums;
    color: var(--yellow);
  }
  #pointCond { font-size: 13px; color: var(--dim); }

  /* height-and-turns readout, bottom-left */
  #meter {
    left: 14px; bottom: 12px;
    padding: 8px 12px 9px 12px;
    background: rgba(16,18,24,0.72);
    border: 1px solid var(--edge);
    border-radius: 6px;
    font-size: 13px; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  #meter b { color: var(--ink); font-weight: 600; }
  #meter .sh { color: var(--blue); }
  #bar {
    position: relative; margin-top: 6px;
    width: 168px; height: 5px; border-radius: 3px;
    background: linear-gradient(to right, var(--blue) 0%, var(--violet) 100%);
    opacity: .75;
  }
  #barKnob {
    position: absolute; top: -3px; width: 3px; height: 11px;
    background: var(--ink); border-radius: 2px;
    transition: left .12s linear;
  }

  /* caption for the guided tour, bottom-centre, fades like a manim Write() */
  #caption {
    left: 50%; transform: translateX(-50%);
    bottom: 68px; max-width: 66%;
    text-align: center; font-size: 15px; line-height: 1.4;
    background: rgba(6,7,10,0.78);
    padding: 7px 14px; border-radius: 6px;
    opacity: 0; transition: opacity .45s ease;
  }
  #caption.show { opacity: 1; }

  /* ---- control panel ---- */
  #panel {
    flex: 0 0 auto;
    border-top: 1px solid var(--edge);
    background: var(--panel);
    padding: 9px 12px 11px 12px;
    box-sizing: border-box;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .row + .row { margin-top: 9px; }
  .lbl { font-size: 13px; color: var(--dim); }

  button {
    font: inherit; font-size: 13.5px;
    padding: 5px 12px; border-radius: 999px;
    color: var(--ink); background: #1a1d26;
    border: 1px solid var(--edge);
    cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  }
  button:hover { background: #232734; }
  button:disabled { opacity: .45; cursor: default; }
  button.active { color: #06070a; font-weight: 600; }
  button i { font-family: var(--serif); }
  #btnStart.active, #btnPi.active, #btn2Pi.active, #btnEnd.active {
    background: var(--yellow); border-color: var(--yellow);
  }
  #btnTop.active   { background: var(--green); border-color: var(--green); color: #06070a; font-weight: 600; }
  #btnTour.running { background: var(--blue); border-color: var(--blue); color: #06070a; font-weight: 600; }
  #btnSpin.active  { background: var(--blue); border-color: var(--blue); color: #06070a; font-weight: 600; }
  #btnFull.active  { background: var(--violet); border-color: var(--violet); color: #06070a; font-weight: 600; }

  .sliderRow { display: flex; align-items: center; gap: 10px; }
  .sliderRow .name {
    font-size: 14px; min-width: 104px;
    font-family: var(--serif);
    font-variant-numeric: tabular-nums;
  }
  input[type=range] {
    flex: 1; min-width: 120px; height: 22px;
    -webkit-appearance: none; appearance: none; background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px; background: var(--edge);
  }
  input[type=range]::-moz-range-track {
    height: 3px; border-radius: 2px; background: var(--edge);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; margin-top: -5.5px;
    border-radius: 50%; background: var(--blue); border: none; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border: none;
    border-radius: 50%; background: var(--blue); cursor: pointer;
  }

  /* On a phone the equation card would cover most of the picture, so it stops
     floating and becomes a strip above the canvas instead. See resize(), which
     takes the strip's height out of the canvas rather than out of the helix. */
  @media (max-width: 560px) {
    #eqcard {
      position: static;
      padding: 7px 12px 8px 12px;
      border: none; border-bottom: 1px solid var(--edge);
      border-radius: 0; background: var(--panel);
      line-height: 1.35;
    }
    .math { font-size: 16px; }
    #pointLine { font-size: 15px; }
    #pointCond { display: none; }          /* the instructions below say the same */
    #panel { padding: 7px 10px 8px 10px; }
    .row + .row { margin-top: 7px; }
    .lbl { display: none; }
    button { font-size: 13px; padding: 4px 10px; }
    .sliderRow .name { min-width: 92px; font-size: 13px; }
    #meter { font-size: 12px; padding: 6px 10px 7px 10px; left: 10px; bottom: 10px; }
    #bar { width: 120px; }
    #caption { font-size: 13px; max-width: 88%; bottom: 58px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="eqcard" class="overlay">
      <div class="math" style="color:#9cdceb"><b><i>r</i></b>(<i>t</i>) = &#10216;cos&#8202;2<i>t</i>, sin&#8202;2<i>t</i>, <i>t</i>&#10217;, &nbsp;0 &le; <i>t</i> &le; 3&pi;</div>
      <div class="math"><i>t</i> = <span id="eqT">0.00</span></div>
      <div id="pointLine">(1.00, 0.00, 0.00)</div>
      <div id="pointCond">the shadow (cos&#8202;2<i>t</i>, sin&#8202;2<i>t</i>) runs around the unit circle while <i>z</i> = <i>t</i> climbs; the example stops at <i>t</i> = &pi;, after one turn</div>
    </div>

    <div id="meter" class="overlay">
      height <b id="zVal">0.00</b> &nbsp;&middot;&nbsp; <span class="sh">shadow</span> <b id="turnVal">0.00</b> turns
      <div id="bar"><div id="barKnob" style="left:0px"></div></div>
    </div>

    <div id="caption" class="overlay"></div>
  </div>

  <div id="panel">
    <div class="row">
      <span class="lbl">Jump to:</span>
      <button id="btnStart"><i>t</i> = 0</button>
      <button id="btnPi"><i>t</i> = &pi;</button>
      <button id="btn2Pi"><i>t</i> = 2&pi;</button>
      <button id="btnEnd"><i>t</i> = 3&pi;</button>
      <span style="flex:1"></span>
      <button id="btnTour">&#9654;&nbsp;Play</button>
      <button id="btnTop" title="Look straight down the z-axis: the helix projects onto the unit circle">&#8615;&nbsp;Top view</button>
      <button id="btnSpin">Spin</button>
      <button id="btnFull" title="Show the figure full screen">&#x26F6;&nbsp;Full screen</button>
    </div>
    <div class="row sliderRow">
      <span class="name"><i>t</i> = <span id="tVal">0.00</span></span>
      <input type="range" id="tSlider" min="0" max="9.42478" step="0.005" value="0"
             aria-label="the parameter t, from 0 to 3 pi">
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // Manim colour constants, so the palette below reads the way a Scene would.
  var BLUE_C = 0x58c4dd, GREEN_C = 0x83c167, YELLOW = 0xffe14d, RED_C = 0xfc6255,
      GOLD_C = 0xf0ac5f, PURPLE_A = 0xcaa3e8, GREY = 0x8a8f9c, INK = 0xece6e2;

  // ---------- the curve ----------
  // The example's helix stops at t = pi, one full turn; the figure lets t run
  // on to 3pi so the next two turns can be watched stacking up above it.
  var TEX = Math.PI, TMAX = 3 * Math.PI, SAMPLES = 720;
  function r(t) { return new THREE.Vector3(Math.cos(2 * t), Math.sin(2 * t), t); }

  // ---------- renderer / scene ----------
  var stage = document.getElementById("stage");
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x06070a);

  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  camera.up.set(0, 0, 1);                 // z is up, the usual maths convention

  // The top view looks straight down the z-axis through an orthographic camera,
  // so that every turn of the helix lands exactly on the unit circle: with
  // perspective the higher turns, being nearer the eye, would come out larger.
  var ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, TMAX + 60);
  var topView = false;
  var TOP_EXT = 2.7;    // half-width of the xy-plane to show: axis tips, labels and all
  var padPx = 0, canvasH = 1;   // set by resize(): the overlays' vertical offset, the canvas height

  // CENTER and CLOUD are measured off the finished scene in fitScene() below.
  // CLOUD is a sample of everything actually drawn, so the framing can be exact
  // rather than a bounding-sphere guess: the helix is much taller than it is
  // wide, and a sphere would leave it marooned in empty space.
  var CENTER = new THREE.Vector3(0, 0, 0.5 * TMAX);
  var CLOUD = [];
  var radius = 12, theta = -0.95, phi = 1.22;
  var aimShift = 0;   // world units to slide the picture down the screen
  var band = 1, aspect = 1;   // set by resize(): the clear strip between overlays

  // The smallest camera distance that still shows every sampled point: for a
  // point at depth (radius - d.e) the frustum is tanV wide, so each point sets a
  // lower bound on the distance and the largest of those bounds wins. Recomputed
  // as the camera moves, so the picture stays whole from every angle.
  var _e = new THREE.Vector3(), _up = new THREE.Vector3(), _rt = new THREE.Vector3();
  function computeRadius() {
    _e.set(Math.sin(phi) * Math.cos(theta), Math.sin(phi) * Math.sin(theta), Math.cos(phi));
    _up.set(0, 0, 1).addScaledVector(_e, -_e.z);
    if (_up.lengthSq() < 1e-9) _up.set(0, 1, 0); else _up.normalize();
    _rt.crossVectors(_up, _e).normalize();

    var tanHalf = Math.tan(camera.fov * Math.PI / 360);
    var tanV = tanHalf * band, tanH = tanHalf * aspect;
    var rr = 1;
    for (var i = 0; i < CLOUD.length; i++) {
      var d = CLOUD[i], along = d.dot(_e);
      rr = Math.max(rr, along + Math.abs(d.dot(_up)) / tanV,
                        along + Math.abs(d.dot(_rt)) / tanH);
    }
    radius = 1.04 * rr;
    camera.far = 2.2 * radius;
    camera.updateProjectionMatrix();
  }

  function placeCamera() {
    computeRadius();
    var eye = new THREE.Vector3(
      radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.sin(phi) * Math.sin(theta),
      radius * Math.cos(phi)
    );
    // Screen-up in world terms: camera.up with the view direction projected out.
    var fwd = eye.clone().negate().normalize();
    var up = camera.up.clone().addScaledVector(fwd, -camera.up.dot(fwd));
    if (up.lengthSq() < 1e-9) up.set(0, 1, 0);
    up.normalize().multiplyScalar(aimShift);

    camera.position.copy(eye).add(up).add(CENTER);
    var look = up.clone().add(CENTER);
    camera.lookAt(look.x, look.y, look.z);
  }

  function placeTop() {
    var halfH = TOP_EXT / band, halfW = halfH * aspect;
    if (halfW < TOP_EXT) { halfW = TOP_EXT; halfH = halfW / aspect; }
    var shift = padPx * 2 * halfH / canvasH;   // centre the picture in the clear band
    ortho.left = -halfW; ortho.right = halfW;
    ortho.top = halfH + shift; ortho.bottom = -halfH + shift;
    ortho.position.set(0, 0, TMAX + 30);
    ortho.up.set(0, 1, 0);                    // x to the right, y up: the xy-plane as drawn
    ortho.lookAt(0, 0, 0);
    ortho.updateProjectionMatrix();
  }

  scene.add(new THREE.AmbientLight(0xffffff, 0.62));
  var key = new THREE.DirectionalLight(0xffffff, 0.62); key.position.set(5, 3, 6);
  var fill = new THREE.DirectionalLight(0x9fd8ff, 0.30); fill.position.set(-4, -5, 2);
  scene.add(key); scene.add(fill);

  // ---------- text sprites (axis and point labels) ----------
  // Drawn in the book's serif. The webfont may still be loading when the sprites
  // are first painted, so they are repainted once document.fonts settles.
  var LABEL_FONT = 'italic 78px "PT Serif", "Times New Roman", Times, serif';
  var LABELS = [];

  function paintLabel(rec) {
    var s = 128, cv = document.createElement("canvas");
    var g = cv.getContext("2d");
    g.font = LABEL_FONT;
    // a label may be a whole coordinate triple, so the canvas is as wide as
    // the text and the sprite is stretched to match
    var w = Math.max(s, Math.ceil(g.measureText(rec.text).width) + 24);
    cv.width = w; cv.height = s;
    g = cv.getContext("2d");
    g.font = LABEL_FONT;
    g.fillStyle = rec.color;
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(rec.text, w / 2, s / 2);
    var tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter;
    if (rec.sprite.material.map) rec.sprite.material.map.dispose();
    rec.sprite.material.map = tex;
    rec.sprite.material.needsUpdate = true;
    rec.sprite.scale.set(rec.size * w / s, rec.size, 1);
  }

  function makeLabel(text, cssColor, size) {
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
      transparent: true, depthTest: false
    }));
    var rec = { sprite: sp, text: text, color: cssColor, size: size || 0.5 };
    LABELS.push(rec);
    paintLabel(rec);
    return sp;
  }

  // ---------- axes, with manim-ish arrow tips ----------
  var Z_PARTS = [];
  (function buildAxes() {
    var mat = new THREE.LineBasicMaterial({ color: GREY, transparent: true, opacity: 0.55 });
    var tipMat = new THREE.MeshBasicMaterial({ color: GREY, transparent: true, opacity: 0.75 });
    var A = 1.75;
    var dirs = [
      { v: new THREE.Vector3(1, 0, 0), rot: [0, 0, -Math.PI / 2], t: "x", lo: -A,   hi: A },
      { v: new THREE.Vector3(0, 1, 0), rot: [0, 0, 0],            t: "y", lo: -A,   hi: A },
      { v: new THREE.Vector3(0, 0, 1), rot: [Math.PI / 2, 0, 0],  t: "z", lo: -0.3, hi: TMAX + 0.7 }
    ];
    dirs.forEach(function (d) {
      var a = d.v.clone().multiplyScalar(d.lo), b = d.v.clone().multiplyScalar(d.hi);
      scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), mat));
      var tip = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.2, 14), tipMat);
      tip.position.copy(b);
      tip.rotation.set(d.rot[0], d.rot[1], d.rot[2]);
      scene.add(tip);
      var lab = makeLabel(d.t, "#9aa0ad", 0.42);
      lab.position.copy(d.v.clone().multiplyScalar(d.hi + 0.3));
      scene.add(lab);
      // seen from straight above, the z-axis is a point at the origin, and its
      // tip and label would only sit on top of the start of the curve
      if (d.t === "z") Z_PARTS.push(tip, lab);
    });
  })();

  // ---------- the floor z = 0, a faint checkerboard, the way manim draws a plane ----------
  (function buildFloor() {
    var n = 8, half = 1.6, pos = [], col = [];
    var cA = new THREE.Color(0x1c2230), cB = new THREE.Color(0x141924);
    for (var j = 0; j < n; j++) {
      for (var i = 0; i < n; i++) {
        var x0 = -half + (2 * half * i) / n, x1 = x0 + (2 * half) / n;
        var y0 = -half + (2 * half * j) / n, y1 = y0 + (2 * half) / n;
        [[x0, y0], [x1, y0], [x1, y1], [x0, y0], [x1, y1], [x0, y1]].forEach(function (p) {
          pos.push(p[0], p[1], -0.004);
        });
        var cc = ((i + j) % 2 === 0) ? cA : cB;
        for (var k = 0; k < 6; k++) col.push(cc.r, cc.g, cc.b);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      vertexColors: true, transparent: true, opacity: 0.55,
      side: THREE.DoubleSide, depthWrite: false
    })));
  })();

  // ---------- glowing tubes, manim's bright stroke on a dark stage ----------
  function tube(points, color, rad, parent, closed) {
    if (points.length < 2) return;
    var curve = new THREE.CatmullRomCurve3(points, !!closed);
    var n = Math.max(48, points.length * 2);
    var host = parent || scene;
    host.add(new THREE.Mesh(new THREE.TubeGeometry(curve, n, rad, 10, !!closed),
      new THREE.MeshBasicMaterial({ color: color })));
    host.add(new THREE.Mesh(new THREE.TubeGeometry(curve, n, rad * 2.7, 10, !!closed),
      new THREE.MeshBasicMaterial({
        color: color, transparent: true, opacity: 0.20,
        blending: THREE.AdditiveBlending, depthWrite: false
      })));
  }

  // ---------- the shadow of the path: the unit circle on the floor, dashed ----------
  (function buildShadow() {
    var pts = [];
    for (var i = 0; i <= 180; i++) {
      var a = (2 * Math.PI * i) / 180;
      pts.push(new THREE.Vector3(Math.cos(a), Math.sin(a), 0));
    }
    var l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineDashedMaterial({
        color: GREY, dashSize: 0.12, gapSize: 0.08,
        transparent: true, opacity: 0.75 }));
    l.computeLineDistances();
    scene.add(l);
  })();

  // ---------- the whole helix, faint: the road ahead ----------
  var HELIX = [];
  (function buildGhost() {
    for (var i = 0; i <= SAMPLES; i++) HELIX.push(r((TMAX * i) / SAMPLES));
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(HELIX),
      new THREE.LineBasicMaterial({ color: BLUE_C, transparent: true, opacity: 0.22 })));
  })();

  // ---------- start and end of the motion ----------
  var END_LABELS = [], TOP_LABEL = null;
  (function buildEnds() {
    var redMat = new THREE.MeshBasicMaterial({ color: RED_C });
    var s = new THREE.Mesh(new THREE.SphereGeometry(0.06, 18, 18), redMat);
    s.position.set(1, 0, 0); scene.add(s);
    // The labels name the parameter values only (the card reads off the
    // coordinates as the point gets there), and each is anchored at one edge
    // beside its dot so that it keeps clear of the point, the x-axis and its
    // label from every viewing angle: the start label hangs below and to the
    // right of the start, the others read off to the right of their dots.
    // Every turn ends directly above the start, at t = pi, 2pi and 3pi; the
    // first of these is the end of the example's own curve.
    var ls = makeLabel("t = 0", "#fc6255", 0.36);
    ls.center.set(0, 1);
    ls.position.set(1.04, -0.04, -0.08); scene.add(ls);
    END_LABELS.push(ls);
    [["t = π", TEX], ["t = 2π", 2 * TEX], ["t = 3π", TMAX]].forEach(function (m) {
      var e = new THREE.Mesh(new THREE.SphereGeometry(0.06, 18, 18), redMat);
      e.position.set(1, 0, m[1]); scene.add(e);
      var le = makeLabel(m[0], "#fc6255", 0.36);
      le.center.set(0, 0.5);
      le.position.set(1.06, -0.06, m[1] + 0.16); scene.add(le);
      END_LABELS.push(le);
    });
    // Seen from straight above all four sit on the same point, so the top view
    // shows this one label in their place.
    TOP_LABEL = makeLabel("t = 0, π, 2π, 3π", "#fc6255", 0.36);
    TOP_LABEL.center.set(0, 1);
    TOP_LABEL.position.set(1.06, -0.08, TMAX);
    TOP_LABEL.visible = false;
    scene.add(TOP_LABEL);
  })();

  // ---------- everything that moves with t ----------
  var movGroup = new THREE.Group();
  scene.add(movGroup);
  var dotMat = new THREE.MeshBasicMaterial({ color: YELLOW });
  var shadowMat = new THREE.MeshBasicMaterial({ color: YELLOW, transparent: true, opacity: 0.55 });
  var vecMat = new THREE.MeshBasicMaterial({ color: PURPLE_A });
  var rLabel = makeLabel("r(t)", "#caa3e8", 0.44);
  rLabel.center.set(1, 0);      // hangs up and to the left of its anchor
  scene.add(rLabel);

  function clearMov() {
    while (movGroup.children.length) {
      var m = movGroup.children.pop();
      if (m.geometry) m.geometry.dispose();
    }
  }
  function dashed(a, b, color) {
    var l = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([a, b]),
      new THREE.LineDashedMaterial({
        color: color, dashSize: 0.1, gapSize: 0.07,
        transparent: true, opacity: 0.7 })
    );
    l.computeLineDistances();
    movGroup.add(l);
  }

  var tVal = 0;

  function updateT() {
    clearMov();
    var P = r(tVal);

    // the part of the helix traced so far, as a bright tube
    var n = Math.max(2, Math.round(SAMPLES * tVal / TMAX) + 1);
    var pts = [];
    for (var i = 0; i < n; i++) pts.push(r((tVal * i) / (n - 1)));
    if (tVal > 1e-3) tube(pts, BLUE_C, 0.028, movGroup);

    // the moving point, and its shadow on the floor
    var dot = new THREE.Mesh(new THREE.SphereGeometry(0.07, 18, 18), dotMat);
    dot.position.copy(P); movGroup.add(dot);
    var sh = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), shadowMat);
    sh.position.set(P.x, P.y, 0); movGroup.add(sh);
    dashed(new THREE.Vector3(P.x, P.y, 0), P, 0xffe14d);

    // the position vector r(t): a violet arrow from the origin to the point
    var len = P.length();
    if (len > 0.05) {
      var dir = P.clone().normalize();
      var tipLen = Math.min(0.22, 0.6 * len);
      var shaftEnd = P.clone().addScaledVector(dir, -tipLen);
      var shaft = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.LineCurve3(new THREE.Vector3(0, 0, 0), shaftEnd),
                               2, 0.022, 10, false), vecMat);
      movGroup.add(shaft);
      var tip = new THREE.Mesh(new THREE.ConeGeometry(0.065, tipLen, 14), vecMat);
      tip.position.copy(P).addScaledVector(dir, -0.5 * tipLen);
      tip.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      movGroup.add(tip);
    }
    // the label sits just above the middle of the arrow, off to the left
    var mid = P.clone().multiplyScalar(0.5);
    rLabel.position.set(mid.x - 0.04, mid.y - 0.04, mid.z + 0.1);
    rLabel.visible = len > 0.4;

    paintReadouts(P);
    render();
  }

  // ---------- readouts ----------
  var elT = document.getElementById("eqT"),
      elPoint = document.getElementById("pointLine"),
      elZ = document.getElementById("zVal"),
      elTurn = document.getElementById("turnVal"),
      elKnob = document.getElementById("barKnob"),
      elTVal = document.getElementById("tVal");

  function fmt(v) {
    var s = v.toFixed(2);
    if (s === "-0.00") s = "0.00";
    return s;
  }

  function paintReadouts(P) {
    elT.textContent = fmt(tVal);
    elPoint.textContent = "(" + fmt(P.x) + ", " + fmt(P.y) + ", " + fmt(P.z) + ")";
    elZ.textContent = fmt(tVal);
    var turns = tVal / Math.PI;                 // 2t / 2pi
    elTurn.textContent = fmt(turns);
    // the bar narrows on a phone, so measure it rather than assume its width
    var barW = elKnob.parentNode.clientWidth || 168;
    elKnob.style.left = (Math.min(1, turns / 3) * barW - 1.5) + "px";
    elTVal.textContent = fmt(tVal);
    tSlider.value = String(tVal);

    document.getElementById("btnStart").classList.toggle("active", tVal < 0.01);
    document.getElementById("btnPi").classList.toggle("active", Math.abs(tVal - TEX) < 0.01);
    document.getElementById("btn2Pi").classList.toggle("active", Math.abs(tVal - 2 * TEX) < 0.01);
    document.getElementById("btnEnd").classList.toggle("active", tVal > TMAX - 0.01);
  }

  // ---------- render loop ----------
  var spinning = false, rafId = null, lastT = 0;

  function render() { renderer.render(scene, topView ? ortho : camera); }

  function frame(now) {
    rafId = requestAnimationFrame(frame);
    var dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0;
    lastT = now;
    var dirty = false;

    if (spinning || tour.running) {
      theta += (tour.running ? 0.10 : 0.22) * dt;
      placeCamera();
      dirty = true;
    }
    if (tween) { stepTween(dt); dirty = true; }   // stepTween redraws the scene itself
    else if (dirty) render();

    if (!spinning && !tour.running && !tween) { cancelAnimationFrame(rafId); rafId = null; lastT = 0; }
  }
  function ensureLoop() { if (rafId === null) { lastT = 0; rafId = requestAnimationFrame(frame); } }

  // ---------- tweening, with manim's smoothstep rate function ----------
  function smooth(t) { return t * t * t * (t * (t * 6 - 15) + 10); }

  var tween = null;
  function animateTo(target, seconds, done) {
    tween = { t0: tVal, t1: target, t: 0, dur: Math.max(0.01, seconds), done: done };
    ensureLoop();
  }
  function stepTween(dt) {
    tween.t += dt;
    var a = smooth(Math.min(1, tween.t / tween.dur));
    tVal = tween.t0 + (tween.t1 - tween.t0) * a;
    updateT();
    if (tween.t >= tween.dur) {
      tVal = tween.t1;
      var cb = tween.done;
      tween = null;
      updateT();
      if (cb) cb();
    }
  }

  // ---------- the guided tour: a little Scene, played in the browser ----------
  var elCaption = document.getElementById("caption");
  function say(text) {
    elCaption.classList.remove("show");
    window.setTimeout(function () {
      elCaption.textContent = text;
      elCaption.classList.add("show");
    }, text ? 160 : 0);
  }

  var STORY = [
    { say: "At t = 0 the point is at (1, 0, 0), on the floor. The violet arrow is its position vector r(t).",
      t: 0, run: 0.6, hold: 1.6 },
    { say: "Its shadow on the floor is (cos 2t, sin 2t): it runs counterclockwise around the unit circle.",
      t: 0.9, run: 2.0, hold: 1.4 },
    { say: "Meanwhile z = t climbs at a steady rate, so the point spirals upward.",
      t: 1.9, run: 2.0, hold: 1.4 },
    { say: "The tip of r(t) rides along the curve; the curve is the set of all those tips.",
      t: 2.5, run: 1.6, hold: 1.4 },
    { say: "At t = π the shadow has gone around exactly once (2t = 2π), and the point is at (1, 0, π), directly above the start. This is the curve of the example.",
      t: TEX, run: 1.6, hold: 2.4 },
    { say: "Nothing stops t there: every further π adds one more turn and π more height, and the point keeps spiralling up.",
      t: 2 * TEX, run: 2.4, hold: 1.4 },
    { say: "At t = 3π the shadow has gone around three times, and the point is at (1, 0, 3π).",
      t: TMAX, run: 2.0, hold: 1.8 },
    { say: "Seen from straight above, every turn lands on the same circle: the whole helix projects onto x² + y² = 1.",
      t: TMAX, run: 0.3, hold: 3.2, view: "top" },
    { say: "Your turn: drag t, drag the figure to look from anywhere, or press Top view to look straight down the z-axis.",
      t: 1.2, run: 1.6, hold: 0.9, view: "orbit" }
  ];

  var tour = { running: false, i: 0, timer: null, top: false };
  var btnTour = document.getElementById("btnTour");

  function tourStep() {
    if (!tour.running) return;
    if (tour.i >= STORY.length) { stopTour(); return; }
    var beat = STORY[tour.i++];
    if (beat.view === "top") { tour.top = true; setTopView(true); }
    else if (beat.view === "orbit" && tour.top) { tour.top = false; setTopView(false); }
    say(beat.say);
    animateTo(beat.t, beat.run, function () {
      if (!tour.running) return;
      tour.timer = window.setTimeout(tourStep, beat.hold * 1000);
    });
  }
  function startTour() {
    tour.running = true; tour.i = 0;
    btnTour.innerHTML = "&#10074;&#10074;&nbsp;Stop";
    btnTour.classList.add("running");
    setSlidersEnabled(false);
    ensureLoop();
    tourStep();
  }
  function stopTour() {
    tour.running = false;
    if (tour.timer) { window.clearTimeout(tour.timer); tour.timer = null; }
    tween = null;
    if (tour.top) { tour.top = false; setTopView(false); }
    btnTour.innerHTML = "&#9654;&nbsp;Play";
    btnTour.classList.remove("running");
    setSlidersEnabled(true);
    say("");
    updateT();
  }
  btnTour.addEventListener("click", function () { tour.running ? stopTour() : startTour(); });

  function setSlidersEnabled(on) {
    tSlider.disabled = !on;
    tSlider.style.opacity = on ? "1" : "0.45";
  }

  // ---------- drag to orbit ----------
  var dragging = false, lastX = 0, lastY = 0;
  var el = renderer.domElement;
  function startDrag(x, y) { dragging = true; lastX = x; lastY = y; }
  function moveDrag(x, y) {
    if (!dragging) return;
    if (topView) leaveTopView();   // dragging the picture takes it out of the top view
    theta -= (x - lastX) * 0.008;
    phi = Math.min(Math.PI - 0.05, Math.max(0.05, phi - (y - lastY) * 0.008));
    lastX = x; lastY = y;
    placeCamera();
    render();
  }
  el.addEventListener("mousedown", function (e) { startDrag(e.clientX, e.clientY); });
  window.addEventListener("mousemove", function (e) { moveDrag(e.clientX, e.clientY); });
  window.addEventListener("mouseup", function () { dragging = false; });
  el.addEventListener("touchstart", function (e) {
    if (e.touches.length === 1) { startDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, { passive: false });
  el.addEventListener("touchmove", function (e) {
    if (e.touches.length === 1) { moveDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, { passive: false });
  window.addEventListener("touchend", function () { dragging = false; });

  // ---------- controls ----------
  var tSlider = document.getElementById("tSlider");

  function jumpTo(t) {
    if (tour.running) stopTour();
    animateTo(t, 0.9);
  }
  document.getElementById("btnStart").addEventListener("click", function () { jumpTo(0); });
  document.getElementById("btnPi").addEventListener("click", function () { jumpTo(TEX); });
  document.getElementById("btn2Pi").addEventListener("click", function () { jumpTo(2 * TEX); });
  document.getElementById("btnEnd").addEventListener("click", function () { jumpTo(TMAX); });

  tSlider.addEventListener("input", function () {
    if (tour.running) stopTour();
    tween = null;
    tVal = parseFloat(tSlider.value);
    updateT();
  });

  var btnSpin = document.getElementById("btnSpin");
  btnSpin.addEventListener("click", function () {
    spinning = !spinning;
    btnSpin.classList.toggle("active", spinning);
    if (spinning) { if (topView) leaveTopView(); ensureLoop(); }
  });

  // ---------- top view: straight down the z-axis, the xy-projection ----------
  // A cut rather than a camera move, the way manim would switch scenes: the
  // orbiting view is put away and the orthographic camera takes over. Pressing
  // the button again, or dragging the picture, brings the old viewpoint back.
  var btnTop = document.getElementById("btnTop");
  var topHint = null;
  function setTopView(on) {
    if (on === topView) return;
    topView = on;
    btnTop.classList.toggle("active", on);
    Z_PARTS.forEach(function (o) { o.visible = !on; });
    END_LABELS.forEach(function (o) { o.visible = !on; });
    TOP_LABEL.visible = on;
    if (on) {
      if (spinning) { spinning = false; btnSpin.classList.remove("active"); }
      placeTop();
    } else {
      if (topHint) { window.clearTimeout(topHint); topHint = null; say(""); }
      placeCamera();
    }
    render();
  }
  function leaveTopView() { setTopView(false); }
  btnTop.addEventListener("click", function () {
    if (tour.running) stopTour();
    setTopView(!topView);
    if (topView) {
      say("Straight down the z-axis: every turn lands on the unit circle x² + y² = 1.");
      topHint = window.setTimeout(function () { say(""); topHint = null; }, 3600);
    }
  });

  // ---------- full screen ----------
  // The figure lives in an iframe, so the request is only honoured when the
  // embedding iframe carries allowfullscreen (custom-html.xsl adds it). Where
  // it is refused anyway, iOS Safari for one, the page opens on its own in a
  // new tab instead, which is the next best thing.
  var btnFull = document.getElementById("btnFull");
  var docEl = document.documentElement;
  function fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  function openStandalone() { window.open(window.location.href, "_blank", "noopener"); }
  btnFull.addEventListener("click", function () {
    if (fsElement()) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      return;
    }
    var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
    if (!req) { openStandalone(); return; }
    try {
      var p = req.call(docEl);
      if (p && p.catch) p.catch(openStandalone);
    } catch (e) { openStandalone(); }
  });
  function onFsChange() {
    var on = !!fsElement();
    btnFull.classList.toggle("active", on);
    btnFull.innerHTML = on ? "&#x26F6;&nbsp;Exit full screen" : "&#x26F6;&nbsp;Full screen";
    // the stage changes size with the window; give the layout a tick to settle
    window.setTimeout(resize, 50);
  }
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);

  // ---------- what has to fit on screen ----------
  // Measured from the finished scene rather than guessed, so that every piece of
  // the picture -- the whole helix, the axis tips and their labels, the end
  // points with their labels, and the arrow at its longest -- is inside the
  // frame from any angle.
  function fitScene() {
    var pts = [], box = new THREE.Box3();
    scene.traverse(function (o) {
      if (o.visible === false) return;
      if (o.isSprite) {                          // a sprite is a billboard rectangle
        var kx = 0.5 * o.scale.x, kz = 0.5 * o.scale.y;
        [[kx, kz], [-kx, -kz]].forEach(function (dd) {
          pts.push(new THREE.Vector3(o.position.x + dd[0], o.position.y + dd[0],
                                     o.position.z + dd[1]));
        });
        return;
      }
      var at = o.geometry && o.geometry.getAttribute && o.geometry.getAttribute("position");
      if (!at) return;
      var step = Math.max(1, Math.floor(at.count / 400));
      for (var i = 0; i < at.count; i += step) {
        pts.push(new THREE.Vector3(at.getX(i), at.getY(i), at.getZ(i)).applyMatrix4(o.matrixWorld));
      }
    });
    if (!pts.length) return;
    pts.forEach(function (p) { box.expandByPoint(p); });
    box.getCenter(CENTER);
    CLOUD = pts.map(function (p) { return p.clone().sub(CENTER); });
  }

  // ---------- sizing (fills the iframe, or the screen) ----------
  // The equation card and the readout are drawn over the canvas, so the picture
  // is framed into the clear band between them rather than into the whole
  // canvas. That keeps them from colliding on a narrow phone as well as on a
  // wide screen.
  function resize() {
    var w = document.getElementById("app").clientWidth;
    // the stage is the flex column's leftover space, so it is measured,
    // not computed: no rounding is left over to make a scrollbar
    var h = stage.clientHeight;

    var card = document.getElementById("eqcard"), meter = document.getElementById("meter");
    // Below 560px the card is a strip above the canvas (see the media query), so it
    // costs canvas height instead of covering the picture.
    var stacked = window.getComputedStyle(card).position === "static";
    var cardH = stacked ? card.offsetHeight : 0;
    var ch = Math.max(120, h - cardH);

    renderer.setSize(w, ch);
    camera.aspect = w / ch;

    // How much vertical room a floating overlay really costs depends on how far it
    // reaches across: spanning the width, the picture must clear it entirely;
    // hugging the left edge of a wide screen, it barely intrudes.
    var reach = function (e) { return Math.min(1, e.offsetWidth / (0.45 * w)); };
    var topPad = stacked ? 0 : (card.offsetHeight + 20) * reach(card);
    var botPad = (meter.offsetHeight + 20) * reach(meter);
    // leave at least a third of the canvas for the picture, however tall the overlays are
    band = Math.max(0.34, (ch - topPad - botPad) / ch);
    aspect = camera.aspect;
    computeRadius();

    // slide the picture into the middle of that band
    var tanHalf = Math.tan(camera.fov * Math.PI / 360);
    padPx = 0.5 * (topPad - botPad); canvasH = ch;
    aimShift = padPx * (2 * radius * tanHalf) / ch;

    placeCamera();
    if (topView) placeTop();
    render();
  }
  window.addEventListener("resize", resize);

  // ---------- go ----------
  // Measure the scene with the moving pieces at their furthest reach, so the
  // frame that holds them there holds them everywhere.
  tVal = TMAX; updateT();
  scene.updateMatrixWorld(true);
  fitScene();
  // open on the frame the static figure shows, the vector at t = 3pi/8
  tVal = 3 * Math.PI / 8; updateT();
  placeCamera();
  resize();

  // repaint the labels once PT Serif has actually arrived
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      LABELS.forEach(paintLabel);
      render();
    });
  }
})();
</script>
</body>
</html>
