<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The tangent vector as a limit of difference quotients -- animated</title>
<!-- The animated companion of the GeoGebra applet rqrxy7j9 in the subsection
     "Tangent Lines to Curves in Space": the helix r(t) = (cos t, sin t, t),
     the point P = r(t0) at t0 = pi/4, the position vectors r(t0) and
     r(t0 + h), the chord between their tips, the difference quotient, and
     the tangent line at P, with a slider for h.  Built on the same pattern
     as helix-manim.html (three.js, manim palette, the book's fonts, a full
     screen button that falls back to a new tab where full screen is refused). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300..800&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
  /* Manim-style palette, identical to helix-manim.html and the animated
     figures of the MATH 13 book. */
  :root {
    --bg:        #06070a;
    --panel:     #101218;
    --edge:      #262a36;
    --ink:       #ece6e2;
    --dim:       #9aa0ad;
    --blue:      #58c4dd;
    --green:     #83c167;
    --yellow:    #ffe14d;
    --red:       #fc6255;
    --gold:      #f0ac5f;
    --pink:      #d147bd;   /* manim PINK: the chord */
    --violet:    #caa3e8;   /* manim PURPLE_A: the position vectors */
    --sans:  "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: "PT Serif", "Times New Roman", Times, serif;
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
               background: var(--bg); }
  body {
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #app { width: 100%; height: 100%; box-sizing: border-box;
         display: flex; flex-direction: column; }

  /* ---- stage ---- */
  #stage { position: relative; width: 100%; background: var(--bg);
           flex: 1 1 auto; min-height: 0; overflow: hidden; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }

  .overlay { position: absolute; pointer-events: none; }

  /* equation card, top-left */
  #eqcard {
    top: 12px; left: 14px;
    padding: 9px 13px 10px 13px;
    background: rgba(16,18,24,0.72);
    border: 1px solid var(--edge);
    border-left: 3px solid var(--blue);
    border-radius: 6px;
    line-height: 1.45;
  }
  .math { font-family: var(--serif); font-size: 17px;
          font-variant-numeric: tabular-nums; }
  .math i, .var { font-style: italic; }
  .math b { font-weight: 700; }
  .c-blue   { color: #9cdceb; }
  .c-pink   { color: var(--pink); }
  .c-green  { color: var(--green); }
  .c-gold   { color: var(--gold); }
  .c-violet { color: var(--violet); }
  #hLine { color: var(--yellow); font-weight: 600; }

  /* angle readout, bottom-left */
  #meter {
    left: 14px; bottom: 12px;
    padding: 8px 12px 9px 12px;
    background: rgba(16,18,24,0.72);
    border: 1px solid var(--edge);
    border-radius: 6px;
    font-size: 13px; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  #meter b { color: var(--ink); font-weight: 600; }
  #meter .g { color: var(--green); }
  #meter .o { color: var(--gold); }
  #bar {
    position: relative; margin-top: 6px;
    width: 180px; height: 5px; border-radius: 3px;
    background: linear-gradient(to right, var(--gold) 0%, var(--green) 100%);
    opacity: .75;
  }
  #barKnob {
    position: absolute; top: -3px; width: 3px; height: 11px;
    background: var(--ink); border-radius: 2px;
    transition: left .12s linear;
  }

  /* caption for the guided tour, bottom-centre */
  #caption {
    left: 50%; transform: translateX(-50%);
    bottom: 68px; max-width: 66%;
    text-align: center; font-size: 15px; line-height: 1.4;
    background: rgba(6,7,10,0.78);
    padding: 7px 14px; border-radius: 6px;
    opacity: 0; transition: opacity .45s ease;
  }
  #caption.show { opacity: 1; }

  /* ---- control panel ---- */
  #panel {
    flex: 0 0 auto;
    border-top: 1px solid var(--edge);
    background: var(--panel);
    padding: 9px 12px 11px 12px;
    box-sizing: border-box;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .row + .row { margin-top: 9px; }
  .lbl { font-size: 13px; color: var(--dim); }

  button {
    font: inherit; font-size: 13.5px;
    padding: 5px 12px; border-radius: 999px;
    color: var(--ink); background: #1a1d26;
    border: 1px solid var(--edge);
    cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  }
  button:hover { background: #232734; }
  button:disabled { opacity: .45; cursor: default; }
  button.active { color: #06070a; font-weight: 600; }
  button i { font-family: var(--serif); }
  .jump.active     { background: var(--yellow); border-color: var(--yellow); }
  #btnClose.active { background: var(--green); border-color: var(--green); color: #06070a; font-weight: 600; }
  #btnTour.running { background: var(--blue); border-color: var(--blue); color: #06070a; font-weight: 600; }
  #btnSpin.active  { background: var(--blue); border-color: var(--blue); color: #06070a; font-weight: 600; }
  #btnFull.active  { background: var(--violet); border-color: var(--violet); color: #06070a; font-weight: 600; }

  .sliderRow { display: flex; align-items: center; gap: 10px; }
  .sliderRow .name {
    font-size: 14px; min-width: 92px;
    font-family: var(--serif);
    font-variant-numeric: tabular-nums;
  }
  input[type=range] {
    flex: 1; min-width: 120px; height: 22px;
    -webkit-appearance: none; appearance: none; background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px; background: var(--edge);
  }
  input[type=range]::-moz-range-track {
    height: 3px; border-radius: 2px; background: var(--edge);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; margin-top: -5.5px;
    border-radius: 50%; background: var(--yellow); border: none; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border: none;
    border-radius: 50%; background: var(--yellow); cursor: pointer;
  }

  /* On a phone the card stops floating and becomes a strip above the canvas;
     resize() takes its height out of the canvas rather than out of the helix. */
  @media (max-width: 560px) {
    #eqcard {
      position: static;
      padding: 7px 12px 8px 12px;
      border: none; border-bottom: 1px solid var(--edge);
      border-radius: 0; background: var(--panel);
      line-height: 1.35;
    }
    .math { font-size: 14.5px; }
    #chordLine { display: none; }        /* the pink arrow still shows it */
    #panel { padding: 7px 10px 8px 10px; }
    .row + .row { margin-top: 7px; }
    .lbl { display: none; }
    button { font-size: 13px; padding: 4px 10px; }
    .sliderRow .name { min-width: 80px; font-size: 13px; }
    #meter { font-size: 12px; padding: 6px 10px 7px 10px; left: 10px; bottom: 10px; }
    #bar { width: 120px; }
    #caption { font-size: 13px; max-width: 88%; bottom: 58px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="eqcard" class="overlay">
      <div class="math c-blue"><b><i>r</i></b>(<i>t</i>) = &#10216;cos&#8202;<i>t</i>, sin&#8202;<i>t</i>, <i>t</i>&#10217;, &nbsp;<i>t</i><sub>0</sub> = &pi;/4</div>
      <div class="math" id="hLine"><i>h</i> = <span id="eqH">1.00</span></div>
      <div class="math c-pink" id="chordLine"><b><i>r</i></b>(<i>t</i><sub>0</sub>+<i>h</i>) &minus; <b><i>r</i></b>(<i>t</i><sub>0</sub>) = <span id="chordVal"></span></div>
      <div class="math c-green"><span id="quotName">[<b><i>r</i></b>(<i>t</i><sub>0</sub>+<i>h</i>) &minus; <b><i>r</i></b>(<i>t</i><sub>0</sub>)]&#8202;/&#8202;<i>h</i></span> = <span id="quotVal"></span></div>
      <div class="math c-gold"><b><i>v</i></b>(<i>t</i><sub>0</sub>) = <b><i>r</i></b>&prime;(<i>t</i><sub>0</sub>) = <span id="velVal"></span></div>
    </div>

    <div id="meter" class="overlay">
      angle between the <span class="g">green arrow</span> and the <span class="o">tangent line</span>: <b id="angVal">0.0&deg;</b>
      <div id="bar"><div id="barKnob" style="left:0px"></div></div>
    </div>

    <div id="caption" class="overlay"></div>
  </div>

  <div id="panel">
    <div class="row">
      <span class="lbl">Jump to:</span>
      <button class="jump" id="btnH15"><i>h</i> = 1.5</button>
      <button class="jump" id="btnH05"><i>h</i> = 0.5</button>
      <button class="jump" id="btnHneg"><i>h</i> = &minus;0.5</button>
      <button class="jump" id="btnH0"><i>h</i> &rarr; 0</button>
      <span style="flex:1"></span>
      <button id="btnTour">&#9654;&nbsp;Play</button>
      <button id="btnClose" title="Zoom in on the point P">&#8981;&nbsp;Close-up</button>
      <button id="btnSpin">Spin</button>
      <button id="btnFull" title="Show the figure full screen">&#x26F6;&nbsp;Full screen</button>
    </div>
    <div class="row sliderRow">
      <span class="name" id="hName"><i>h</i> = 1.00</span>
      <input type="range" id="hSlider" min="-0.78" max="2" step="0.005" value="1"
             aria-label="the change in time h, from minus 0.78 to 2">
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // Manim colour constants.
  var BLUE_C = 0x58c4dd, GREEN_C = 0x83c167, YELLOW = 0xffe14d, RED_C = 0xfc6255,
      GOLD_C = 0xf0ac5f, PINK = 0xd147bd, PURPLE_A = 0xcaa3e8, GREY = 0x8a8f9c;

  // ---------- the curve and the fixed time ----------
  // The helix of the example, three quarters of a turn, and t0 = pi/4. The slider keeps
  // t0 + h inside the turn that is drawn: h runs from just above -t0 to 2.
  var TMAX = 1.5 * Math.PI, SAMPLES = 360;
  var T0 = Math.PI / 4, HMIN = -0.78, HMAX = 2, HZERO = 0.0025;
  function r(t)  { return new THREE.Vector3(Math.cos(t), Math.sin(t), t); }
  function rp(t) { return new THREE.Vector3(-Math.sin(t), Math.cos(t), 1); }
  var P = r(T0), V = rp(T0);

  // ---------- renderer / scene ----------
  var stage = document.getElementById("stage");
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x06070a);

  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  camera.up.set(0, 0, 1);                 // z is up

  // Two framings, each a centre plus a sample of what must stay on screen:
  // the whole scene, and a close-up box around P and the arrows leaving it.
  // zoomMix blends between them, so the close-up is a camera move, not a cut.
  var FULL = { center: new THREE.Vector3(), cloud: [] };
  var CLOSE = { center: new THREE.Vector3(), cloud: [] };
  var CENTER = new THREE.Vector3();
  var zoomMix = 0, zoomTarget = 0;
  var radius = 12, theta = -0.55, phi = 1.18;
  var aimShift = 0;
  var band = 1, aspect = 1;

  var _e = new THREE.Vector3(), _up = new THREE.Vector3(), _rt = new THREE.Vector3();
  function fitRadius(cloud) {
    var tanHalf = Math.tan(camera.fov * Math.PI / 360);
    var tanV = tanHalf * band, tanH = tanHalf * aspect;
    var rr = 1;
    for (var i = 0; i < cloud.length; i++) {
      var d = cloud[i], along = d.dot(_e);
      rr = Math.max(rr, along + Math.abs(d.dot(_up)) / tanV,
                        along + Math.abs(d.dot(_rt)) / tanH);
    }
    return 1.04 * rr;
  }
  function computeRadius() {
    _e.set(Math.sin(phi) * Math.cos(theta), Math.sin(phi) * Math.sin(theta), Math.cos(phi));
    _up.set(0, 0, 1).addScaledVector(_e, -_e.z);
    if (_up.lengthSq() < 1e-9) _up.set(0, 1, 0); else _up.normalize();
    _rt.crossVectors(_up, _e).normalize();

    var m = smooth(zoomMix);
    var rFull = fitRadius(FULL.cloud), rClose = fitRadius(CLOSE.cloud);
    // blend the logarithm of the distance, so the zoom feels even
    radius = Math.exp((1 - m) * Math.log(rFull) + m * Math.log(rClose));
    CENTER.copy(FULL.center).lerp(CLOSE.center, m);
    camera.near = Math.max(0.02, radius / 200);
    camera.far = 2.5 * radius + 20;
    camera.updateProjectionMatrix();
  }

  function placeCamera() {
    computeRadius();
    var eye = new THREE.Vector3(
      radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.sin(phi) * Math.sin(theta),
      radius * Math.cos(phi)
    );
    var fwd = eye.clone().negate().normalize();
    var up = camera.up.clone().addScaledVector(fwd, -camera.up.dot(fwd));
    if (up.lengthSq() < 1e-9) up.set(0, 1, 0);
    var tanHalf = Math.tan(camera.fov * Math.PI / 360);
    up.normalize().multiplyScalar(aimShift * (2 * radius * tanHalf));

    camera.position.copy(eye).add(up).add(CENTER);
    var look = up.clone().add(CENTER);
    camera.lookAt(look.x, look.y, look.z);
  }

  scene.add(new THREE.AmbientLight(0xffffff, 0.62));
  var key = new THREE.DirectionalLight(0xffffff, 0.62); key.position.set(5, 3, 6);
  var fill = new THREE.DirectionalLight(0x9fd8ff, 0.30); fill.position.set(-4, -5, 2);
  scene.add(key); scene.add(fill);

  // ---------- text sprites ----------
  var LABEL_FONT = 'italic 78px "PT Serif", "Times New Roman", Times, serif';
  var LABELS = [];

  function paintLabel(rec) {
    var s = 128, cv = document.createElement("canvas");
    var g = cv.getContext("2d");
    g.font = LABEL_FONT;
    var w = Math.max(s, Math.ceil(g.measureText(rec.text).width) + 24);
    cv.width = w; cv.height = s;
    g = cv.getContext("2d");
    g.font = LABEL_FONT;
    g.fillStyle = rec.color;
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(rec.text, w / 2, s / 2);
    var tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter;
    if (rec.sprite.material.map) rec.sprite.material.map.dispose();
    rec.sprite.material.map = tex;
    rec.sprite.material.needsUpdate = true;
    rec.sprite.scale.set(rec.size * w / s, rec.size, 1);
  }
  function makeLabel(text, cssColor, size) {
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
      transparent: true, depthTest: false
    }));
    var rec = { sprite: sp, text: text, color: cssColor, size: size || 0.5, base: size || 0.5 };
    LABELS.push(rec);
    paintLabel(rec);
    return rec;
  }

  // ---------- axes ----------
  (function buildAxes() {
    var mat = new THREE.LineBasicMaterial({ color: GREY, transparent: true, opacity: 0.55 });
    var tipMat = new THREE.MeshBasicMaterial({ color: GREY, transparent: true, opacity: 0.75 });
    var A = 1.75;
    var dirs = [
      { v: new THREE.Vector3(1, 0, 0), rot: [0, 0, -Math.PI / 2], t: "x", lo: -A,   hi: A },
      { v: new THREE.Vector3(0, 1, 0), rot: [0, 0, 0],            t: "y", lo: -A,   hi: A },
      { v: new THREE.Vector3(0, 0, 1), rot: [Math.PI / 2, 0, 0],  t: "z", lo: -0.3, hi: TMAX + 0.7 }
    ];
    dirs.forEach(function (d) {
      var a = d.v.clone().multiplyScalar(d.lo), b = d.v.clone().multiplyScalar(d.hi);
      scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), mat));
      var tip = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.2, 14), tipMat);
      tip.position.copy(b);
      tip.rotation.set(d.rot[0], d.rot[1], d.rot[2]);
      scene.add(tip);
      var lab = makeLabel(d.t, "#9aa0ad", 0.5);
      lab.sprite.position.copy(d.v.clone().multiplyScalar(d.hi + 0.3));
      scene.add(lab.sprite);
    });
  })();

  // ---------- the floor z = 0 ----------
  (function buildFloor() {
    var n = 8, half = 1.6, pos = [], col = [];
    var cA = new THREE.Color(0x1c2230), cB = new THREE.Color(0x141924);
    for (var j = 0; j < n; j++) {
      for (var i = 0; i < n; i++) {
        var x0 = -half + (2 * half * i) / n, x1 = x0 + (2 * half) / n;
        var y0 = -half + (2 * half * j) / n, y1 = y0 + (2 * half) / n;
        [[x0, y0], [x1, y0], [x1, y1], [x0, y0], [x1, y1], [x0, y1]].forEach(function (p) {
          pos.push(p[0], p[1], -0.004);
        });
        var cc = ((i + j) % 2 === 0) ? cA : cB;
        for (var k = 0; k < 6; k++) col.push(cc.r, cc.g, cc.b);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      vertexColors: true, transparent: true, opacity: 0.55,
      side: THREE.DoubleSide, depthWrite: false
    })));
  })();

  // ---------- glowing tubes ----------
  function tube(points, color, rad, parent, opacity) {
    if (points.length < 2) return;
    var curve = new THREE.CatmullRomCurve3(points, false);
    var n = Math.max(48, points.length * 2);
    var host = parent || scene;
    var op = opacity === undefined ? 1 : opacity;
    host.add(new THREE.Mesh(new THREE.TubeGeometry(curve, n, rad, 10, false),
      new THREE.MeshBasicMaterial({ color: color, transparent: op < 1, opacity: op })));
    host.add(new THREE.Mesh(new THREE.TubeGeometry(curve, n, rad * 2.7, 10, false),
      new THREE.MeshBasicMaterial({
        color: color, transparent: true, opacity: 0.20 * op,
        blending: THREE.AdditiveBlending, depthWrite: false
      })));
  }

  // An arrow from a to b: a tube shaft and a cone tip, the tip shortened for a
  // short arrow so it never overshoots. The thickness scales with the view, so
  // the arrows stay slender in the close-up.
  var thick = 1;
  function arrow(a, b, color, rad, parent, opacity, onTop) {
    var d = b.clone().sub(a), len = d.length();
    if (len < 1e-4) return;
    rad *= thick;
    var dir = d.normalize();
    var tipLen = Math.min(7 * rad, 0.55 * len), tipRad = 2.9 * rad;
    var op = opacity === undefined ? 1 : opacity;
    var mat = new THREE.MeshBasicMaterial({ color: color, transparent: op < 1, opacity: op,
                                            depthWrite: op >= 1, depthTest: !onTop });
    var shaftEnd = b.clone().addScaledVector(dir, -tipLen);
    if (len - tipLen > 1e-4) {
      var shaft = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.LineCurve3(a, shaftEnd), 2, rad, 10, false), mat);
      if (onTop) shaft.renderOrder = 2;
      parent.add(shaft);
    }
    var tip = new THREE.Mesh(new THREE.ConeGeometry(tipRad, tipLen, 16), mat);
    if (onTop) tip.renderOrder = 2;
    tip.position.copy(b).addScaledVector(dir, -0.5 * tipLen);
    tip.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    parent.add(tip);
  }

  // ---------- the shadow circle and the whole helix ----------
  (function buildShadow() {
    var pts = [];
    for (var i = 0; i <= 180; i++) {
      var a = (2 * Math.PI * i) / 180;
      pts.push(new THREE.Vector3(Math.cos(a), Math.sin(a), 0));
    }
    var l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineDashedMaterial({
        color: GREY, dashSize: 0.12, gapSize: 0.08,
        transparent: true, opacity: 0.6 }));
    l.computeLineDistances();
    scene.add(l);
  })();

  // Everything that depends on the view's scale (tube and arrow thickness) is
  // rebuilt by rebuildStatic() and updateH(), so the close-up stays crisp.
  var staticGroup = new THREE.Group();
  scene.add(staticGroup);
  var movGroup = new THREE.Group();
  scene.add(movGroup);

  function clearGroup(g) {
    while (g.children.length) {
      var m = g.children.pop();
      if (m.geometry) m.geometry.dispose();
      if (m.material) m.material.dispose();
    }
  }

  // The tangent line runs a fixed length either side of P.
  var S_LO = -1.05, S_HI = 1.7;
  function rebuildStatic() {
    clearGroup(staticGroup);
    var pts = [];
    for (var i = 0; i <= SAMPLES; i++) pts.push(r((TMAX * i) / SAMPLES));
    tube(pts, BLUE_C, 0.014 * thick, staticGroup, 0.8);
    // the tangent line at P, in gold
    tube([P.clone().addScaledVector(V, S_LO), P.clone().addScaledVector(V, S_HI)],
         GOLD_C, 0.016 * thick, staticGroup, 0.95);
    // v(t0) itself, faint, so the green arrow can be seen landing on it
    arrow(P, P.clone().add(V), GOLD_C, 0.03, staticGroup, 0.38);
    // P
    var dot = new THREE.Mesh(new THREE.SphereGeometry(0.065 * thick, 18, 18),
                             new THREE.MeshBasicMaterial({ color: YELLOW }));
    dot.position.copy(P); staticGroup.add(dot);
  }

  // ---------- labels ----------
  var labP  = makeLabel("P", "#ffe14d", 0.5);
  var labR0 = makeLabel("r(t₀)", "#caa3e8", 0.46);
  var labR1 = makeLabel("r(t₀+h)", "#caa3e8", 0.46);
  var labTL = makeLabel("tangent line", "#f0ac5f", 0.42);
  [labP, labR0, labR1, labTL].forEach(function (l) { scene.add(l.sprite); });
  labP.sprite.center.set(-0.25, 1.05);   // below and to the right of P

  labTL.sprite.center.set(0, 0.5);
  function scaleLabels() {
    LABELS.forEach(function (l) {
      var k = l.sprite.scale.x / l.sprite.scale.y;
      l.sprite.scale.set(l.base * thick * k, l.base * thick, 1);
    });
  }

  // ---------- everything that moves with h ----------
  var hVal = 1;
  var ORIGIN = new THREE.Vector3(0, 0, 0);

  function quotient(h) {
    if (Math.abs(h) < HZERO) return V.clone();            // the limit itself
    return r(T0 + h).sub(P).multiplyScalar(1 / h);
  }

  function updateH() {
    clearGroup(movGroup);
    var atLimit = Math.abs(hVal) < HZERO;
    var Q = r(T0 + hVal), chord = Q.clone().sub(P), D = quotient(hVal);

    // the position vectors, from the origin, in violet
    arrow(ORIGIN, P, PURPLE_A, 0.02, movGroup);
    if (!atLimit) arrow(ORIGIN, Q, PURPLE_A, 0.02, movGroup, 0.8);

    // the second point, and the arc of the curve between the two times
    if (!atLimit) {
      var q = new THREE.Mesh(new THREE.SphereGeometry(0.05 * thick, 16, 16),
                             new THREE.MeshBasicMaterial({ color: 0xffffff }));
      q.position.copy(Q); movGroup.add(q);
    }

    // The chord and the difference quotient lie on the same line through P,
    // so the chord r(t0 + h) - r(t0) is a thick pink sleeve and the quotient
    // a thinner green arrow drawn on top of it: both stay visible where they
    // overlap, whichever is longer.
    if (chord.length() > 0.02) arrow(P, Q, PINK, 0.036, movGroup);
    arrow(P, P.clone().add(D), GREEN_C, 0.018, movGroup, 1, true);

    // labels
    labP.sprite.position.copy(P);
    // the two position-vector labels sit part way up their arrows, pushed
    // apart, each on its own side, so neither lands on P
    var side = P.clone().sub(Q); side.z = 0;
    if (side.lengthSq() < 1e-6) side.set(1, -1, 0);
    side.normalize().multiplyScalar(0.16);
    labR0.sprite.position.copy(P).multiplyScalar(0.42).add(side);
    labR1.sprite.position.copy(Q).multiplyScalar(0.42).sub(side);
    labR1.sprite.visible = Math.abs(hVal) > 0.45 && zoomMix < 0.5;
    labR0.sprite.visible = zoomMix < 0.5;
    labTL.sprite.position.copy(P).addScaledVector(V, S_HI * 0.92).add(new THREE.Vector3(0.08, 0, 0));

    paintReadouts(chord, D, atLimit);
    render();
  }

  // ---------- readouts ----------
  var elH = document.getElementById("eqH"),
      elHVal = document.getElementById("hName"),
      elChord = document.getElementById("chordVal"),
      elQuot = document.getElementById("quotVal"),
      elQuotName = document.getElementById("quotName"),
      elVel = document.getElementById("velVal"),
      elAng = document.getElementById("angVal"),
      elKnob = document.getElementById("barKnob"),
      hSlider = document.getElementById("hSlider");
  var QUOT_NAME = elQuotName.innerHTML;

  function fmt(v) {
    var s = v.toFixed(2);
    if (s === "-0.00") s = "0.00";
    return s.replace("-", "−");
  }
  function vec(u) { return "⟨" + fmt(u.x) + ", " + fmt(u.y) + ", " + fmt(u.z) + "⟩"; }

  elVel.textContent = vec(V);

  function paintReadouts(chord, D, atLimit) {
    elH.textContent = atLimit ? "0 (the limit)" : fmt(hVal);
    elHVal.innerHTML = "<i>h</i> " + (atLimit ? "&rarr; 0" : "= " + fmt(hVal));
    elChord.textContent = vec(chord);
    elQuotName.innerHTML = atLimit ? "lim<sub><i>h</i>&rarr;0</sub>&#8202;" + QUOT_NAME : QUOT_NAME;
    elQuot.textContent = vec(D);
    var c = D.dot(V) / (D.length() * V.length());
    var ang = Math.acos(Math.max(-1, Math.min(1, c))) * 180 / Math.PI;
    elAng.textContent = ang.toFixed(1) + "°";
    var barW = elKnob.parentNode.clientWidth || 180;
    elKnob.style.left = (Math.min(1, ang / 45) * barW - 1.5) + "px";
    hSlider.value = String(hVal);

    [["btnH15", 1.5], ["btnH05", 0.5], ["btnHneg", -0.5], ["btnH0", 0]].forEach(function (b) {
      document.getElementById(b[0]).classList.toggle("active", Math.abs(hVal - b[1]) < 0.003);
    });
  }

  // ---------- render loop ----------
  var spinning = false, rafId = null, lastT = 0;
  function render() { renderer.render(scene, camera); }

  function frame(now) {
    rafId = requestAnimationFrame(frame);
    var dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0;
    lastT = now;
    var dirty = false;

    if (spinning || tour.running) {
      theta += (tour.running ? 0.10 : 0.22) * dt;
      dirty = true;
    }
    if (zoomMix !== zoomTarget) {
      var step = dt / 0.9;
      zoomMix = zoomTarget > zoomMix ? Math.min(zoomTarget, zoomMix + step)
                                     : Math.max(zoomTarget, zoomMix - step);
      setThickness();
      dirty = true;
    }
    if (dirty) placeCamera();
    if (tween) stepTween(dt);          // stepTween redraws the scene itself
    else if (dirty) updateH();

    if (!spinning && !tour.running && !tween && zoomMix === zoomTarget) {
      cancelAnimationFrame(rafId); rafId = null; lastT = 0;
    }
  }
  function ensureLoop() { if (rafId === null) { lastT = 0; rafId = requestAnimationFrame(frame); } }

  // The close-up is a fraction of the full view across, so the strokes and
  // labels shrink with it; rebuild the static strokes only when that changes.
  var lastThick = -1;
  function setThickness() {
    var m = smooth(zoomMix);
    thick = Math.exp(m * Math.log(0.5));
    if (Math.abs(thick - lastThick) > 0.01) {
      lastThick = thick;
      rebuildStatic();
      scaleLabels();
    }
  }

  // ---------- tweening, with manim's smoothstep rate function ----------
  function smooth(t) { return t * t * t * (t * (t * 6 - 15) + 10); }

  var tween = null;
  function animateTo(target, seconds, done) {
    tween = { h0: hVal, h1: target, t: 0, dur: Math.max(0.01, seconds), done: done };
    ensureLoop();
  }
  function stepTween(dt) {
    tween.t += dt;
    var a = smooth(Math.min(1, tween.t / tween.dur));
    hVal = tween.h0 + (tween.h1 - tween.h0) * a;
    updateH();
    if (tween.t >= tween.dur) {
      hVal = tween.h1;
      var cb = tween.done;
      tween = null;
      updateH();
      if (cb) cb();
    }
  }

  // ---------- the guided tour ----------
  var elCaption = document.getElementById("caption");
  function say(text) {
    elCaption.classList.remove("show");
    window.setTimeout(function () {
      elCaption.textContent = text;
      elCaption.classList.add("show");
    }, text ? 160 : 0);
  }

  var STORY = [
    { say: "Fix t₀ = π/4 and mark the point P = r(t₀) on the helix. The violet arrows are the position vectors r(t₀) and r(t₀ + h).",
      h: 1.5, run: 0.8, hold: 2.6 },
    { say: "The pink arrow r(t₀ + h) − r(t₀) joins the two points: it is a chord of the curve.",
      h: 1.5, run: 0.1, hold: 2.4 },
    { say: "Dividing the chord by h gives the green arrow, the difference quotient. It lies along the chord, just rescaled by 1/h.",
      h: 1.5, run: 0.1, hold: 2.8 },
    { say: "Now let h shrink. The second point slides toward P and the chord gets shorter...",
      h: 0.5, run: 2.6, hold: 1.2 },
    { say: "...but dividing by h keeps the green arrow from shrinking to nothing. Look closer.",
      h: 0.5, run: 0.1, hold: 1.6, zoom: 1 },
    { say: "As h → 0 the chord swings into the tangent line, and the green arrow turns onto the gold one.",
      h: 0.05, run: 3.0, hold: 1.4 },
    { say: "In the limit it is the tangent vector v(t₀) = r′(t₀) = ⟨−sin t₀, cos t₀, 1⟩, pointing along the tangent line at P.",
      h: 0, run: 0.8, hold: 3.0 },
    { say: "For h < 0 the chord points backwards, to an earlier point. But h is negative too, so the quotient still points forward.",
      h: -0.5, run: 2.2, hold: 3.0 },
    { say: "From either side, the difference quotient tends to the same tangent vector.",
      h: 0, run: 2.4, hold: 2.2 },
    { say: "Your turn: drag h, drag the figure to look from anywhere, or zoom in with Close-up.",
      h: 1, run: 1.6, hold: 0.9, zoom: 0 }
  ];

  var tour = { running: false, i: 0, timer: null };
  var btnTour = document.getElementById("btnTour");
  var btnClose = document.getElementById("btnClose");

  function setZoom(on) {
    zoomTarget = on ? 1 : 0;
    btnClose.classList.toggle("active", on);
    ensureLoop();
  }

  function tourStep() {
    if (!tour.running) return;
    if (tour.i >= STORY.length) { stopTour(); return; }
    var beat = STORY[tour.i++];
    if (beat.zoom !== undefined) setZoom(beat.zoom === 1);
    say(beat.say);
    animateTo(beat.h, beat.run, function () {
      if (!tour.running) return;
      tour.timer = window.setTimeout(tourStep, beat.hold * 1000);
    });
  }
  function startTour() {
    tour.running = true; tour.i = 0;
    btnTour.innerHTML = "&#10074;&#10074;&nbsp;Stop";
    btnTour.classList.add("running");
    setSlidersEnabled(false);
    setZoom(false);
    ensureLoop();
    tourStep();
  }
  function stopTour() {
    tour.running = false;
    if (tour.timer) { window.clearTimeout(tour.timer); tour.timer = null; }
    tween = null;
    btnTour.innerHTML = "&#9654;&nbsp;Play";
    btnTour.classList.remove("running");
    setSlidersEnabled(true);
    say("");
    updateH();
  }
  btnTour.addEventListener("click", function () { tour.running ? stopTour() : startTour(); });

  function setSlidersEnabled(on) {
    hSlider.disabled = !on;
    hSlider.style.opacity = on ? "1" : "0.45";
  }

  // ---------- drag to orbit ----------
  var dragging = false, lastX = 0, lastY = 0;
  var el = renderer.domElement;
  function startDrag(x, y) { dragging = true; lastX = x; lastY = y; }
  function moveDrag(x, y) {
    if (!dragging) return;
    theta -= (x - lastX) * 0.008;
    phi = Math.min(Math.PI - 0.05, Math.max(0.05, phi - (y - lastY) * 0.008));
    lastX = x; lastY = y;
    placeCamera();
    render();
  }
  el.addEventListener("mousedown", function (e) { startDrag(e.clientX, e.clientY); });
  window.addEventListener("mousemove", function (e) { moveDrag(e.clientX, e.clientY); });
  window.addEventListener("mouseup", function () { dragging = false; });
  el.addEventListener("touchstart", function (e) {
    if (e.touches.length === 1) { startDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, { passive: false });
  el.addEventListener("touchmove", function (e) {
    if (e.touches.length === 1) { moveDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, { passive: false });
  window.addEventListener("touchend", function () { dragging = false; });

  // ---------- controls ----------
  function jumpTo(h) {
    if (tour.running) stopTour();
    animateTo(h, 1.1);
  }
  document.getElementById("btnH15").addEventListener("click", function () { jumpTo(1.5); });
  document.getElementById("btnH05").addEventListener("click", function () { jumpTo(0.5); });
  document.getElementById("btnHneg").addEventListener("click", function () { jumpTo(-0.5); });
  document.getElementById("btnH0").addEventListener("click", function () {
    if (tour.running) stopTour();
    animateTo(0, 2.2);
  });

  hSlider.addEventListener("input", function () {
    if (tour.running) stopTour();
    tween = null;
    var v = parseFloat(hSlider.value);
    hVal = Math.abs(v) < HZERO ? 0 : v;
    updateH();
  });

  btnClose.addEventListener("click", function () {
    if (tour.running) stopTour();
    setZoom(zoomTarget === 0);
  });

  var btnSpin = document.getElementById("btnSpin");
  btnSpin.addEventListener("click", function () {
    spinning = !spinning;
    btnSpin.classList.toggle("active", spinning);
    if (spinning) ensureLoop();
  });

  // ---------- full screen ----------
  // The figure lives in an iframe, so the request is only honoured when the
  // embedding iframe carries allowfullscreen (custom-html.xsl adds it for
  // interactive/@iframe). Where it is refused anyway, iOS Safari for one, the
  // page opens on its own in a new tab instead.
  var btnFull = document.getElementById("btnFull");
  var docEl = document.documentElement;
  function fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  function openStandalone() { window.open(window.location.href, "_blank", "noopener"); }
  btnFull.addEventListener("click", function () {
    if (fsElement()) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      return;
    }
    var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
    if (!req) { openStandalone(); return; }
    try {
      var p = req.call(docEl);
      if (p && p.catch) p.catch(openStandalone);
    } catch (e) { openStandalone(); }
  });
  function onFsChange() {
    var on = !!fsElement();
    btnFull.classList.toggle("active", on);
    btnFull.innerHTML = on ? "&#x26F6;&nbsp;Exit full screen" : "&#x26F6;&nbsp;Full screen";
    window.setTimeout(resize, 50);
  }
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);

  // ---------- what has to fit on screen ----------
  function collect(pts) {
    scene.updateMatrixWorld(true);
    scene.traverse(function (o) {
      if (o.visible === false) return;
      if (o.isSprite) {
        var kx = 0.5 * o.scale.x, kz = 0.5 * o.scale.y;
        [[kx, kz], [-kx, -kz]].forEach(function (dd) {
          pts.push(new THREE.Vector3(o.position.x + dd[0], o.position.y + dd[0],
                                     o.position.z + dd[1]));
        });
        return;
      }
      var at = o.geometry && o.geometry.getAttribute && o.geometry.getAttribute("position");
      if (!at) return;
      var step = Math.max(1, Math.floor(at.count / 400));
      for (var i = 0; i < at.count; i += step) {
        pts.push(new THREE.Vector3(at.getX(i), at.getY(i), at.getZ(i)).applyMatrix4(o.matrixWorld));
      }
    });
  }
  function setFraming(F, pts) {
    var box = new THREE.Box3();
    pts.forEach(function (p) { box.expandByPoint(p); });
    box.getCenter(F.center);
    F.cloud = pts.map(function (p) { return p.clone().sub(F.center); });
  }
  function fitScene() {
    // the whole scene, with the moving pieces at both ends of the slider
    var pts = [];
    hVal = HMAX; updateH(); collect(pts);
    hVal = HMIN; updateH(); collect(pts);
    setFraming(FULL, pts);
    // the close-up: P, the tangent vector, and a margin around them
    var c = [], M = 0.3;
    [P, P.clone().addScaledVector(V, 0.95), P.clone().addScaledVector(V, -0.4)].forEach(function (p) {
      for (var i = 0; i < 8; i++) {
        c.push(new THREE.Vector3(p.x + (i & 1 ? M : -M), p.y + (i & 2 ? M : -M),
                                 p.z + (i & 4 ? M : -M)));
      }
    });
    setFraming(CLOSE, c);
  }

  // ---------- sizing ----------
  var padPx = 0;
  function resize() {
    var w = document.getElementById("app").clientWidth;
    var h = stage.clientHeight;

    var card = document.getElementById("eqcard"), meter = document.getElementById("meter");
    var stacked = window.getComputedStyle(card).position === "static";
    var cardH = stacked ? card.offsetHeight : 0;
    var ch = Math.max(120, h - cardH);

    renderer.setSize(w, ch);
    camera.aspect = w / ch;

    var reach = function (e) { return Math.min(1, e.offsetWidth / (0.45 * w)); };
    var topPad = stacked ? 0 : (card.offsetHeight + 20) * reach(card);
    var botPad = (meter.offsetHeight + 20) * reach(meter);
    band = Math.max(0.34, (ch - topPad - botPad) / ch);
    aspect = camera.aspect;

    padPx = 0.5 * (topPad - botPad);
    aimShift = padPx / ch;           // placeCamera() turns this into world units

    placeCamera();
    updateH();
  }
  window.addEventListener("resize", resize);

  // ---------- go ----------
  setThickness();
  fitScene();
  hVal = 1;
  resize();

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      LABELS.forEach(paintLabel);
      scaleLabels();
      render();
    });
  }
})();
</script>
</body>
</html>
