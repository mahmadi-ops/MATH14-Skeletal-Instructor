<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The area of a wall as a line integral (animated)</title>
<!-- The animated companion of the example "The wall on a half circle" in the
     subsection "A Geometric Interpretation" of Line Integrals: the graph of
     f(x, y) = 2 + x^2 y, the base of the wall (the upper half C of the unit
     circle, on the floor), the top of the wall (the curve on the graph directly
     above C), and n slabs of constant heights f(x(t_k), y(t_k)) whose total area
     approximates the area of the wall, 2 pi + 2/3.  The four step buttons build
     the picture in that order, and a slider sets n.  Built on the same pattern
     as tangent-line-manim.html (three.js, manim palette, the book's fonts, a
     full screen button that falls back to a new tab where full screen is
     refused). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300..800&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
  /* Manim-style palette, identical to tangent-line-manim.html and the animated
     figures of the MATH 13 book. */
  :root {
    --bg:        #06070a;
    --panel:     #101218;
    --edge:      #262a36;
    --ink:       #ece6e2;
    --dim:       #9aa0ad;
    --blue:      #58c4dd;   /* manim BLUE_C: the graph of f, and the slabs */
    --green:     #83c167;
    --yellow:    #ffe14d;   /* the base of the wall */
    --red:       #fc6255;   /* the top of the wall */
    --gold:      #f0ac5f;   /* the wall, and its area */
    --violet:    #caa3e8;
    --sans:  "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: "PT Serif", "Times New Roman", Times, serif;
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
               background: var(--bg); }
  body {
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #app { width: 100%; height: 100%; box-sizing: border-box;
         display: flex; flex-direction: column; }

  /* ---- stage ---- */
  #stage { position: relative; width: 100%; background: var(--bg);
           flex: 1 1 auto; min-height: 0; overflow: hidden; }
  canvas { display: block; }
  #stage > canvas { cursor: grab; }
  #stage > canvas:active { cursor: grabbing; }

  .overlay { position: absolute; pointer-events: none; }

  /* the three pieces of the wall, top-left; each row lights up once its
     piece is on the stage */
  #eqcard {
    top: 12px; left: 14px;
    padding: 8px 13px 9px 13px;
    background: rgba(16,18,24,0.72);
    border: 1px solid var(--edge);
    border-left: 3px solid var(--blue);
    border-radius: 6px;
    display: grid; grid-template-columns: auto auto;
    column-gap: 12px; row-gap: 2px; align-items: baseline;
  }
  .key { font-size: 12.5px; color: var(--dim); white-space: nowrap; }
  .math { font-family: var(--serif); font-size: 17px; white-space: nowrap;
          font-variant-numeric: tabular-nums; }
  .math i { font-style: italic; }
  .math sub, .math sup { font-size: 70%; line-height: 0; }
  .c-blue   { color: #9cdceb; }
  .c-yellow { color: var(--yellow); }
  .c-red    { color: var(--red); }
  .c-gold   { color: var(--gold); }
  .piece { transition: opacity .35s ease; }

  /* the running total, bottom-left: the slabs against the wall */
  #meter {
    left: 14px; bottom: 12px;
    padding: 8px 12px 9px 12px;
    background: rgba(16,18,24,0.72);
    border: 1px solid var(--edge);
    border-radius: 6px;
    display: flex; align-items: center; gap: 14px;
    transition: opacity .35s ease;
  }
  #meterText { display: grid; grid-template-columns: auto auto; column-gap: 8px;
               row-gap: 3px; align-items: baseline; }
  #meterText .math { font-size: 15.5px; }
  .swatch { display: inline-block; vertical-align: middle; }
  .sw-slab { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); }
  .sw-wall { width: 14px; height: 0; border-top: 2px dashed var(--gold); }
  #plot { pointer-events: auto; cursor: pointer; }

  /* caption for the guided tour, centred just above the meter (resize()
     sets its bottom offset) */
  #caption {
    left: 50%; transform: translateX(-50%);
    bottom: 96px; max-width: 70%;
    text-align: center; font-size: 15px; line-height: 1.4;
    background: rgba(6,7,10,0.8);
    padding: 7px 14px; border-radius: 6px;
    opacity: 0; transition: opacity .45s ease;
  }
  #caption.show { opacity: 1; }
  #caption i { font-family: var(--serif); font-size: 1.07em; }
  #caption sub { font-size: 70%; line-height: 0; }

  /* ---- control panel ---- */
  #panel {
    flex: 0 0 auto;
    border-top: 1px solid var(--edge);
    background: var(--panel);
    padding: 9px 12px 11px 12px;
    box-sizing: border-box;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .row + .row { margin-top: 9px; }
  .lbl { font-size: 13px; color: var(--dim); }

  button {
    font: inherit; font-size: 13.5px;
    padding: 5px 12px; border-radius: 999px;
    color: var(--ink); background: #1a1d26;
    border: 1px solid var(--edge);
    cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  }
  button:hover { background: #232734; }
  button:disabled { opacity: .45; cursor: default; }
  button i { font-family: var(--serif); }
  .step b { font-weight: 700; margin-right: 3px; }
  /* a step already on the stage is outlined in its piece's colour; the step
     just played is filled with it */
  #btnS1.done { border-color: var(--blue); }
  #btnS2.done { border-color: var(--yellow); }
  #btnS3.done { border-color: var(--red); }
  #btnS4.done { border-color: var(--green); }
  #btnS1.active { background: var(--blue);   border-color: var(--blue);   color: #06070a; font-weight: 600; }
  #btnS2.active { background: var(--yellow); border-color: var(--yellow); color: #06070a; font-weight: 600; }
  #btnS3.active { background: var(--red);    border-color: var(--red);    color: #06070a; font-weight: 600; }
  #btnS4.active { background: var(--green);  border-color: var(--green);  color: #06070a; font-weight: 600; }
  #btnTour.running { background: var(--blue); border-color: var(--blue); color: #06070a; font-weight: 600; }
  #btnSpin.active  { background: var(--blue); border-color: var(--blue); color: #06070a; font-weight: 600; }
  #btnFull.active  { background: var(--violet); border-color: var(--violet); color: #06070a; font-weight: 600; }
  #btnLabel.active { background: var(--ink); border-color: var(--ink); color: #06070a; font-weight: 600; }

  .sliderRow { display: flex; align-items: center; gap: 10px; }
  .sliderRow .name {
    font-size: 14px; min-width: 96px;
    font-family: var(--serif);
    font-variant-numeric: tabular-nums;
  }
  #meterText #dsVal { font-size: 13.5px; color: var(--dim); }
  input[type=range] {
    flex: 1; min-width: 120px; height: 22px;
    -webkit-appearance: none; appearance: none; background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px; background: var(--edge);
  }
  input[type=range]::-moz-range-track {
    height: 3px; border-radius: 2px; background: var(--edge);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; margin-top: -5.5px;
    border-radius: 50%; background: var(--blue); border: none; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border: none;
    border-radius: 50%; background: var(--blue); cursor: pointer;
  }

  /* On a phone the card stops floating and becomes a strip above the canvas;
     resize() takes its height out of the canvas rather than out of the wall.
     The little plot gives way to the two numbers it summarizes. */
  @media (max-width: 560px) {
    #eqcard {
      position: static;
      padding: 5px 12px 6px 12px;
      border: none; border-bottom: 1px solid var(--edge);
      border-radius: 0; background: var(--panel);
      display: flex; flex-wrap: wrap; column-gap: 16px; row-gap: 0;
    }
    .math { font-size: 14.5px; }
    .key, .dsrow, #btnSpin { display: none; }
    #meterText .math { font-size: 13.5px; }
    #plot { display: none; }
    #meterText #dsVal { font-size: 12.5px; }
    #panel { padding: 7px 10px 8px 10px; }
    .row + .row { margin-top: 7px; }
    .lbl, .long { display: none; }
    button { font-size: 13px; padding: 4px 10px; }
    .sliderRow .name { min-width: 52px; font-size: 13px; }
    #meter { padding: 6px 10px 7px 10px; left: 10px; bottom: 10px; }
    #caption { font-size: 13px; max-width: 90%; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="eqcard" class="overlay">
      <span class="key piece" id="k1">surface</span>
      <span class="math c-blue piece" id="m1"><i>z</i> = <i>f</i>(<i>x</i>, <i>y</i>) = 2 + <i>x</i><sup>2</sup><i>y</i></span>
      <span class="key piece" id="k2">base of the wall</span>
      <span class="math c-yellow piece" id="m2"><i>C</i>: <i>x</i><sup>2</sup> + <i>y</i><sup>2</sup> = 1, <i>y</i> &ge; 0</span>
      <span class="key piece" id="k3">top of the wall</span>
      <span class="math c-red piece" id="m3"><i>z</i> = <i>f</i>(<i>x</i>, <i>y</i>) above <i>C</i></span>
    </div>

    <div id="meter" class="overlay">
      <div id="meterText">
        <span class="dsrow"></span>
        <span class="math dsrow" id="dsVal"><i>n</i> = 8, &nbsp;&Delta;<i>s</i> = &pi;/8 &asymp; 0.393</span>
        <span class="swatch sw-slab"></span>
        <span class="math"><span class="c-blue">&sum;&#8202;<i>f</i>(<i>x</i>(<i>t<sub>k</sub></i>), <i>y</i>(<i>t<sub>k</sub></i>))&#8202;&Delta;<i>s</i></span> = <b id="sumVal">6.9237</b></span>
        <span class="swatch sw-wall"></span>
        <span class="math"><span class="c-gold">&int;<sub><i>C</i></sub>&#8202;<i>f</i>(<i>x</i>, <i>y</i>)&#8202;<i>ds</i></span> = 2&pi; + &frac23; &asymp; <b>6.9499</b></span>
      </div>
      <canvas id="plot" role="img"
              aria-label="The total area of the slabs for n from 1 to 64: it rises from 2 pi toward the area of the wall, 2 pi plus two thirds, about 6.9499. Click a point to pick that n."></canvas>
    </div>

    <div id="caption" class="overlay"></div>
  </div>

  <div id="panel">
    <div class="row">
      <span class="lbl">Build:</span>
      <button class="step" id="btnS1" title="Graph the surface z = f(x, y)"><b>1</b> Surface</button>
      <button class="step" id="btnS2" title="Draw the base of the wall, the curve C"><b>2</b> Base<span class="long"> of the wall</span></button>
      <button class="step" id="btnS3" title="Go up from C to the surface: the top of the wall"><b>3</b> Top<span class="long"> of the wall</span></button>
      <button class="step" id="btnS4" title="Cut the wall into n slabs"><b>4</b> Slabs</button>
    </div>
    <div class="row sliderRow">
      <span class="name" id="nName"><i>n</i> = 8<span class="long"> slabs</span></span>
      <input type="range" id="nSlider" min="1" max="64" step="1" value="8"
             aria-label="the number of slabs n, from 1 to 64">
      <button id="btnTour" aria-label="Play the guided tour" title="A guided tour: the wall built step by step, then more and more slabs">&#9654;<span class="long">&nbsp;Play</span></button>
      <button id="btnLabel" aria-label="Label a slab" title="Label one slab: its height, its width and its area">Label<span class="long"> a slab</span></button>
      <button id="btnSpin">Spin</button>
      <button id="btnFull" aria-label="Full screen" title="Show the figure full screen">&#x26F6;<span class="long">&nbsp;Full screen</span></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // Manim colour constants. BLUE_D and BLUE_E are the two squares of manim's
  // checkerboard Surface; BLUE_C to GREEN_C is the gradient of its Riemann
  // rectangles.
  var BLUE_C = 0x58c4dd, BLUE_D = 0x29abca, BLUE_E = 0x236b8e, GREEN_C = 0x83c167,
      YELLOW = 0xffe14d, RED_C = 0xfc6255, GOLD_C = 0xf0ac5f, GREY = 0x8a8f9c,
      INK = 0xece6e2, BG = 0x06070a;

  // ---------- the example ----------
  // The wall stands on C: r(t) = (cos t, sin t), 0 <= t <= pi, and reaches up to
  // the graph of f. Since |r'(t)| = 1, ds = dt, and its area is
  //   int_C f ds = int_0^pi (2 + cos^2 t sin t) dt = 2 pi + 2/3.
  // To show another wall: change f, the curve (onBase, TMAX), EXACT, the
  // surface's domain (RS, in step 1 below), and the text of the card, the
  // meter and the tour captions to match. The slab sum assumes |r'(t)| = 1;
  // for another curve, weight each height by the length of its piece.
  function f(x, y) { return 2 + x * x * y; }
  var TMAX = Math.PI;
  function height(t) { return f(Math.cos(t), Math.sin(t)); }
  function onBase(t, z) { return new THREE.Vector3(Math.cos(t), Math.sin(t), z || 0); }
  function onTop(t) { return onBase(t, height(t)); }
  var EXACT = 2 * Math.PI + 2 / 3;
  var NMAX = 64;

  // n pieces of C, each of length ds = pi/n; the kth slab takes the height at
  // the left end of its piece, as in the book: t_k = (k - 1) ds.
  function slabHeights(n) {
    var h = [];
    for (var k = 0; k < n; k++) h.push(height(k * TMAX / n));
    return h;
  }
  function total(h) {
    var s = 0;
    for (var k = 0; k < h.length; k++) s += h[k];
    return s * TMAX / h.length;
  }
  var SUMS = [NaN];
  for (var i0 = 1; i0 <= NMAX; i0++) SUMS.push(total(slabHeights(i0)));

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  // manim's smooth rate function
  function smooth(t) { return t * t * t * (t * (t * 6 - 15) + 10); }

  // ---------- renderer / scene ----------
  var stage = document.getElementById("stage");
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);

  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  camera.up.set(0, 0, 1);                 // z is up

  // The framing is measured once, off the finished scene (fitScene below): a
  // centre and a sample of every point that must stay on screen. As the view
  // turns, the camera is placed as close as it can be while the whole sample
  // still fits, and panned so the picture sits in the middle of the frame
  // (seen at an angle, the wall is lopsided about its own centre).
  var CENTER = new THREE.Vector3(), CLOUD = [], SPRITES = [];
  var radius = 10, theta = -1.34, phi = 1.16;
  var THETA0 = theta;
  var aimShift = 0, band = 1, aspect = 1, panU = 0, panR = 0;

  var _e = new THREE.Vector3(), _up = new THREE.Vector3(), _rt = new THREE.Vector3();
  var _A = [], _U = [], _R = [];
  // The pans c for which every point at depth (rad - A) lies within the
  // frustum's half-width tan * (rad - A) of the axis, or null if none do.
  function panRange(rad, V, tan) {
    var lo = -Infinity, hi = Infinity;
    for (var i = 0; i < _A.length; i++) {
      var w = tan * (rad - _A[i]);
      if (w <= 0) return null;
      if (V[i] - w > lo) lo = V[i] - w;
      if (V[i] + w < hi) hi = V[i] + w;
    }
    return lo <= hi ? [lo, hi] : null;
  }
  function computeRadius() {
    _e.set(Math.sin(phi) * Math.cos(theta), Math.sin(phi) * Math.sin(theta), Math.cos(phi));
    _up.set(0, 0, 1).addScaledVector(_e, -_e.z);
    if (_up.lengthSq() < 1e-9) _up.set(0, 1, 0); else _up.normalize();
    _rt.crossVectors(_up, _e).normalize();
    var tanHalf = Math.tan(camera.fov * Math.PI / 360);
    var tanV = tanHalf * band, tanH = tanHalf * aspect;
    var lo = 0, hi = 1;
    _A.length = _U.length = _R.length = 0;
    function take(along, u, r) {
      _A.push(along); _U.push(u); _R.push(r);
      lo = Math.max(lo, along);
      // unpanned, this distance always fits
      hi = Math.max(hi, along + Math.abs(u) / tanV, along + Math.abs(r) / tanH);
    }
    for (var i = 0; i < CLOUD.length; i++) {
      var d = CLOUD[i];
      take(d.dot(_e), d.dot(_up), d.dot(_rt));
    }
    // a label faces the camera, so its corners lie along the screen axes, on
    // the side of its anchor that its text runs
    for (var j = 0; j < SPRITES.length; j++) {
      var sp = SPRITES[j], a0 = sp.p.dot(_e), u0 = sp.p.dot(_up), r0 = sp.p.dot(_rt);
      for (var c = 0; c < 4; c++) {
        take(a0, u0 + (c & 1 ? 1 - sp.cy : -sp.cy) * sp.h, r0 + (c & 2 ? 1 - sp.cx : -sp.cx) * sp.w);
      }
    }
    // the smallest distance at which some pan fits both ways, by bisection
    for (var it = 0; it < 28; it++) {
      var mid = 0.5 * (lo + hi);
      if (panRange(mid, _U, tanV) && panRange(mid, _R, tanH)) hi = mid; else lo = mid;
    }
    radius = 1.04 * hi;
    var pu = panRange(radius, _U, tanV), pr = panRange(radius, _R, tanH);
    panU = pu ? 0.5 * (pu[0] + pu[1]) : 0;
    panR = pr ? 0.5 * (pr[0] + pr[1]) : 0;
    camera.near = Math.max(0.02, radius / 200);
    camera.far = 2.5 * radius + 20;
    camera.updateProjectionMatrix();
  }

  function placeCamera() {
    computeRadius();
    var tanHalf = Math.tan(camera.fov * Math.PI / 360);
    // the pan that centres the picture, plus the shift that centres it in
    // the clear band between the overlays
    var aim = CENTER.clone()
      .addScaledVector(_up, panU + aimShift * (2 * radius * tanHalf))
      .addScaledVector(_rt, panR);
    camera.position.copy(aim).addScaledVector(_e, radius);
    camera.lookAt(aim.x, aim.y, aim.z);
  }

  scene.add(new THREE.AmbientLight(0xffffff, 0.62));
  var key = new THREE.DirectionalLight(0xffffff, 0.62); key.position.set(5, 3, 6);
  var fill = new THREE.DirectionalLight(0x9fd8ff, 0.30); fill.position.set(-4, -5, 2);
  scene.add(key); scene.add(fill);

  // ---------- text sprites ----------
  // A label may carry subscripts, written A_k or x_{12}; they are set smaller
  // and lower, as in the book's mathematics.
  var LABEL_PX = 78;
  var LABELS = [];
  function runsOf(text) {
    var out = [], buf = "", i = 0;
    while (i < text.length) {
      if (text[i] === "_") {
        if (buf) { out.push({ t: buf, sub: false }); buf = ""; }
        if (text[i + 1] === "{") {
          var j = text.indexOf("}", i + 2);
          out.push({ t: text.slice(i + 2, j), sub: true }); i = j + 1;
        } else { out.push({ t: text[i + 1], sub: true }); i += 2; }
      } else { buf += text[i]; i++; }
    }
    if (buf) out.push({ t: buf, sub: false });
    return out;
  }
  function fontFor(rec, sub) {
    var px = sub ? Math.round(LABEL_PX * 0.68) : LABEL_PX;
    return (rec.upright ? "" : "italic ") + px + 'px "PT Serif", "Times New Roman", Times, serif';
  }
  function paintLabel(rec) {
    var s = 128, cv = document.createElement("canvas");
    var g = cv.getContext("2d"), runs = runsOf(rec.text), w = 0;
    runs.forEach(function (r) { g.font = fontFor(rec, r.sub); r.w = g.measureText(r.t).width; w += r.w; });
    var W = Math.max(s, Math.ceil(w) + 24);
    cv.width = W; cv.height = s;
    g = cv.getContext("2d");
    g.fillStyle = rec.color;
    g.textBaseline = "alphabetic";
    // a dark halo under the letters keeps them legible over the slabs
    g.lineJoin = "round";
    g.lineWidth = 10;
    g.strokeStyle = "rgba(6,7,10,0.82)";
    [true, false].forEach(function (halo) {
      var x = (W - w) / 2, base = s / 2 + 0.3 * LABEL_PX;
      runs.forEach(function (r) {
        g.font = fontFor(rec, r.sub);
        var y = r.sub ? base + 0.2 * LABEL_PX : base;
        if (halo) g.strokeText(r.t, x, y); else g.fillText(r.t, x, y);
        x += r.w;
      });
    });
    var tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter;
    if (rec.sprite.material.map) rec.sprite.material.map.dispose();
    rec.sprite.material.map = tex;
    rec.sprite.material.needsUpdate = true;
    rec.sprite.scale.set(rec.size * W / s, rec.size, 1);
  }
  // opts.upright sets the text roman (numbers); opts.behind lets the label be
  // hidden by the slabs, as the axes are, instead of floating over everything
  function makeLabel(text, cssColor, size, opts) {
    opts = opts || {};
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthTest: !!opts.behind }));
    sp.renderOrder = 5;
    var rec = { sprite: sp, text: text, color: cssColor, size: size || 0.4, upright: !!opts.upright };
    LABELS.push(rec);
    paintLabel(rec);
    scene.add(sp);
    return rec;
  }
  function setOpacity(rec, a) {
    rec.sprite.material.opacity = a;
    rec.sprite.visible = a > 0.01;
  }

  // ---------- axes, with a few ticks to read heights by ----------
  (function buildAxes() {
    var mat = new THREE.LineBasicMaterial({ color: GREY, transparent: true, opacity: 0.55 });
    var tipMat = new THREE.MeshBasicMaterial({ color: GREY, transparent: true, opacity: 0.75 });
    var dirs = [
      { v: new THREE.Vector3(1, 0, 0), rot: [0, 0, -Math.PI / 2], t: "x", lo: -1.55, hi: 1.7,
        ticks: [-1, 1], across: new THREE.Vector3(0, 0.05, 0), at: new THREE.Vector3(0, -0.2, -0.06) },
      { v: new THREE.Vector3(0, 1, 0), rot: [0, 0, 0],            t: "y", lo: -0.55, hi: 1.7,
        ticks: [1], across: new THREE.Vector3(0.05, 0, 0), at: new THREE.Vector3(-0.18, 0, -0.06) },
      { v: new THREE.Vector3(0, 0, 1), rot: [Math.PI / 2, 0, 0],  t: "z", lo: 0,     hi: 3.3,
        ticks: [1, 2, 3], across: new THREE.Vector3(0.05, 0, 0), at: new THREE.Vector3(-0.17, -0.05, 0) }
    ];
    dirs.forEach(function (d) {
      var a = d.v.clone().multiplyScalar(d.lo), b = d.v.clone().multiplyScalar(d.hi);
      scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), mat));
      var tip = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.17, 14), tipMat);
      tip.position.copy(b);
      tip.rotation.set(d.rot[0], d.rot[1], d.rot[2]);
      scene.add(tip);
      var lab = makeLabel(d.t, "#9aa0ad", 0.4, { behind: true });
      lab.sprite.position.copy(d.v.clone().multiplyScalar(d.hi + 0.24));
      d.ticks.forEach(function (v) {
        var p = d.v.clone().multiplyScalar(v);
        scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
          [p.clone().sub(d.across), p.clone().add(d.across)]), mat));
        var tl = makeLabel(String(v).replace("-", "−"), "#9aa0ad", 0.24, { upright: true, behind: true });
        tl.sprite.position.copy(p).add(d.at);
      });
    });
  })();

  // ---------- the floor z = 0 ----------
  (function buildFloor() {
    var pos = [], col = [], s = 0.4;
    var cA = new THREE.Color(0x1c2230), cB = new THREE.Color(0x141924);
    for (var j = 0; j < 6; j++) {
      for (var i = 0; i < 8; i++) {
        var x0 = -1.6 + s * i, x1 = x0 + s, y0 = -0.8 + s * j, y1 = y0 + s;
        [[x0, y0], [x1, y0], [x1, y1], [x0, y0], [x1, y1], [x0, y1]].forEach(function (p) {
          pos.push(p[0], p[1], -0.004);
        });
        var cc = ((i + j) % 2 === 0) ? cA : cB;
        for (var k = 0; k < 6; k++) col.push(cc.r, cc.g, cc.b);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      vertexColors: true, transparent: true, opacity: 0.55,
      side: THREE.DoubleSide, depthWrite: false
    })));
  })();

  // ---------- glowing tubes ----------
  function tube(points, color, rad, parent, opacity) {
    if (points.length < 2) return;
    var curve = new THREE.CatmullRomCurve3(points, false);
    var n = Math.max(24, points.length * 2);
    var op = opacity === undefined ? 1 : opacity;
    parent.add(new THREE.Mesh(new THREE.TubeGeometry(curve, n, rad, 8, false),
      new THREE.MeshBasicMaterial({ color: color, transparent: op < 1, opacity: op })));
    parent.add(new THREE.Mesh(new THREE.TubeGeometry(curve, n, rad * 2.7, 8, false),
      new THREE.MeshBasicMaterial({
        color: color, transparent: true, opacity: 0.2 * op,
        blending: THREE.AdditiveBlending, depthWrite: false
      })));
  }
  function dot(p, color, rad, parent, opacity) {
    var op = opacity === undefined ? 1 : opacity;
    var m = new THREE.Mesh(new THREE.SphereGeometry(rad, 16, 16),
      new THREE.MeshBasicMaterial({ color: color, transparent: op < 1, opacity: op }));
    m.position.copy(p);
    parent.add(m);
  }
  function clearGroup(g) {
    while (g.children.length) {
      var m = g.children.pop();
      if (m.geometry) m.geometry.dispose();
      if (m.material) m.material.dispose();
    }
  }
  function group() { var g = new THREE.Group(); scene.add(g); return g; }

  // ---------- step 1: the surface z = f(x, y) ----------
  // The graph over the half disc of radius RS above the x-axis, in manim's
  // checkerboard: 5 rings by 12 sectors, each cell 4 by 4 facets, with the
  // normals of the graph itself so it shades smoothly. The ring r = 1 of the
  // mesh is exactly the top of the wall.
  var RS = 1.25, NR = 20, NTH = 48;
  var surfMat = new THREE.MeshLambertMaterial({
    vertexColors: true, transparent: true, opacity: 0.5,
    side: THREE.DoubleSide, depthWrite: false
  });
  var gridMat = new THREE.LineBasicMaterial({ color: 0xbfe6f2, transparent: true, opacity: 0.35 });
  var gridLines = [];
  (function buildSurface() {
    var pos = [], nor = [], col = [];
    var cD = new THREE.Color(BLUE_D), cE = new THREE.Color(BLUE_E);
    function vert(r, a, c) {
      var x = r * Math.cos(a), y = r * Math.sin(a);
      var nv = new THREE.Vector3(-2 * x * y, -x * x, 1).normalize();
      pos.push(x, y, f(x, y)); nor.push(nv.x, nv.y, nv.z); col.push(c.r, c.g, c.b);
    }
    for (var i = 0; i < NR; i++) {
      for (var j = 0; j < NTH; j++) {
        var r0 = RS * i / NR, r1 = RS * (i + 1) / NR;
        var a0 = Math.PI * j / NTH, a1 = Math.PI * (j + 1) / NTH;
        var c = (Math.floor(i / 4) + Math.floor(j / 4)) % 2 === 0 ? cD : cE;
        vert(r0, a0, c); vert(r1, a0, c); vert(r1, a1, c);
        vert(r0, a0, c); vert(r1, a1, c); vert(r0, a1, c);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
    geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    var mesh = new THREE.Mesh(geo, surfMat);
    mesh.renderOrder = 1;
    scene.add(mesh);

    // the mesh lines: rings every 0.25, rays every 15 degrees
    function line(pts) {
      var l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat);
      l.userData.count = pts.length;
      scene.add(l);
      gridLines.push(l);
    }
    for (var k = 1; k <= 5; k++) {
      var r = 0.25 * k, pts = [];
      for (var m = 0; m <= 96; m++) {
        var a = Math.PI * m / 96, x = r * Math.cos(a), y = r * Math.sin(a);
        pts.push(new THREE.Vector3(x, y, f(x, y) + 0.003));
      }
      line(pts);
    }
    for (var q = 0; q <= 12; q++) {
      var ang = Math.PI * q / 12, ray = [];
      for (var s = 0; s <= 24; s++) {
        var rr = RS * s / 24, xx = rr * Math.cos(ang), yy = rr * Math.sin(ang);
        ray.push(new THREE.Vector3(xx, yy, f(xx, yy) + 0.003));
      }
      line(ray);
    }
  })();
  var labF = makeLabel("z = f(x, y)", "#9cdceb", 0.34);
  labF.sprite.center.set(0, 0.5);
  (function () {
    var a = 0.14 * Math.PI, x = RS * Math.cos(a), y = RS * Math.sin(a);
    labF.sprite.position.set(x + 0.08, y, f(x, y) + 0.12);
  })();

  // ---------- step 2: the base of the wall, C on the floor ----------
  // the arrow and the name sit near the start of C, on the side nearest the
  // viewer, and the name inside the circle, where the slabs cannot cover it
  var T_ARROW = 0.16 * Math.PI;
  var baseGroup = group();
  var labC = makeLabel("C", "#ffe14d", 0.42);
  labC.sprite.position.copy(onBase(T_ARROW + 0.06).multiplyScalar(0.8));

  // ---------- step 3: the top of the wall, and the wall ----------
  var topGroup = group();

  // ---------- step 4: the slabs ----------
  var slabGroup = group();
  var slabMat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  var labA = makeLabel("A_k", "#ece6e2", 0.36);
  var labDs = makeLabel("Δs", "#ece6e2", 0.32);
  var labH = makeLabel("f(x(t_k), y(t_k))", "#ece6e2", 0.3);

  // ---------- the state of the picture ----------
  // Every piece has an amount from 0 (not there) to 1 (fully drawn); the steps
  // and the tour animate these, and draw() renders whatever they say.
  //   surf   the surface: its mesh lines are drawn, then it fills in
  //   base   how much of C has been traced
  //   top    how far the wall has been swept out along C
  //   dim    the surface fades back once the slabs are up
  //   fade   so does the wall itself, all but a trace of it
  //   slabs  the slabs rising from the floor, one after another
  //   lab    the labels on one slab
  var S = { surf: 1, base: 1, top: 1, dim: 1, fade: 1, slabs: 1, lab: 0 };
  var nCur = 8;
  // while n doubles, split = { from: n, p: 0..1 }: each slab splits in two, and
  // the right half's height slides to the height at its own left end
  var split = null;

  function drawSurface() {
    var a = S.surf;
    var lines = clamp01(a / 0.6), fillA = clamp01((a - 0.4) / 0.6);
    gridLines.forEach(function (l) {
      l.geometry.setDrawRange(0, Math.round(l.userData.count * lines));
      l.visible = lines > 0;
    });
    gridMat.opacity = 0.35 * (1 - 0.6 * S.dim);
    surfMat.opacity = 0.5 * fillA * (1 - 0.66 * S.dim);
    surfMat.visible = fillA > 0;
    setOpacity(labF, fillA * (1 - 0.3 * S.dim));
  }

  function drawBase() {
    clearGroup(baseGroup);
    var b = S.base;
    setOpacity(labC, clamp01((b - 0.85) / 0.15));
    if (b <= 0) return;
    var tEnd = TMAX * b, m = Math.max(2, Math.ceil(120 * b)), pts = [];
    for (var i = 0; i <= m; i++) pts.push(onBase(tEnd * i / m, 0.004));
    tube(pts, YELLOW, 0.021, baseGroup);
    dot(onBase(0, 0.004), YELLOW, 0.04, baseGroup);
    if (b < 1) {
      dot(onBase(tEnd, 0.004), 0xffffff, 0.045, baseGroup);
    } else {
      dot(onBase(TMAX, 0.004), YELLOW, 0.04, baseGroup);
    }
    // the direction of C: counterclockwise, from (1, 0) to (-1, 0)
    var arr = clamp01((b - 0.85) / 0.15);
    if (arr > 0) {
      var tip = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.17, 16),
        new THREE.MeshBasicMaterial({ color: YELLOW, transparent: arr < 1, opacity: arr }));
      tip.position.copy(onBase(T_ARROW, 0.004));
      tip.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0),
        new THREE.Vector3(-Math.sin(T_ARROW), Math.cos(T_ARROW), 0));
      baseGroup.add(tip);
    }
  }

  function drawTop() {
    clearGroup(topGroup);
    var w = S.top;
    if (w <= 0) return;
    var tEnd = TMAX * w, m = Math.max(2, Math.ceil(120 * w));
    // the wall: a sheet from the floor up to the graph, see-through gold
    var pos = [], nor = [];
    function v(t, z) { pos.push(Math.cos(t), Math.sin(t), z); nor.push(Math.cos(t), Math.sin(t), 0); }
    for (var i = 0; i < m; i++) {
      var ta = tEnd * i / m, tb = tEnd * (i + 1) / m;
      v(ta, 0); v(tb, 0); v(tb, height(tb));
      v(ta, 0); v(tb, height(tb)); v(ta, height(ta));
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
    var sheet = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({
      color: GOLD_C, transparent: true, opacity: 0.34 * (1 - 0.62 * S.fade),
      side: THREE.DoubleSide, depthWrite: false }));
    topGroup.add(sheet);
    // posts every 10 degrees, the way the book's figure draws the wall
    var postA = 0.55 * (1 - S.fade);
    if (postA > 0.01) {
      var seg = [];
      for (var d = 0; d <= 180; d += 10) {
        var t = d * Math.PI / 180;
        if (t > tEnd + 1e-9) break;
        seg.push(onBase(t), onTop(t));
      }
      if (seg.length) {
        topGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(seg),
          new THREE.LineBasicMaterial({ color: GOLD_C, transparent: true, opacity: postA })));
      }
    }
    // the top edge, on the graph directly above C
    var pts = [];
    for (var j = 0; j <= m; j++) pts.push(onTop(tEnd * j / m));
    tube(pts, RED_C, 0.02, topGroup);
    // while it is being swept out: the segment from C straight up to the graph
    if (w < 1) {
      tube([onBase(tEnd, 0.004), onTop(tEnd)], INK, 0.011, topGroup);
      dot(onBase(tEnd, 0.004), YELLOW, 0.045, topGroup);
      dot(onTop(tEnd), RED_C, 0.05, topGroup);
    }
  }

  // the slab heights on show, and the one to label
  function currentHeights() {
    if (!split) return slabHeights(nCur);
    var h0 = slabHeights(split.from), h1 = slabHeights(2 * split.from), h = [];
    for (var k = 0; k < h1.length; k++) {
      h.push(k % 2 === 0 ? h1[k] : h0[(k - 1) / 2] + (h1[k] - h0[(k - 1) / 2]) * split.p);
    }
    return h;
  }
  // the slab that starts at t = 3 pi / 8 or just before it: near the back of
  // the wall, where it faces the viewer, but clear of the z-axis
  function labelledSlab(n) { return Math.floor(3 * n / 8); }

  var shownTotal = SUMS[8];
  function drawSlabs() {
    clearGroup(slabGroup);
    var g = S.slabs, h = currentHeights(), n = h.length;
    shownTotal = total(h);
    var labOp = S.lab * clamp01(g * 3 - 2);
    [labA, labDs, labH].forEach(function (l) { setOpacity(l, labOp); });
    if (g <= 0) return;
    var ds = TMAX / n, gap = Math.min(0.006, 0.08 * ds), sub = Math.max(1, Math.ceil(96 / n));
    var LAG = 1.2, kh = labelledSlab(n);
    var cA = new THREE.Color(BLUE_C), cB = new THREE.Color(GREEN_C);
    var pos = [], nor = [], col = [];
    for (var k = 0; k < n; k++) {
      // manim's LaggedStart: the slabs rise one after another, from t = 0 on
      var gk = smooth(clamp01(g * (1 + LAG) - LAG * (n > 1 ? k / (n - 1) : 0)));
      if (gk <= 0) continue;
      var hk = h[k] * gk;
      var t0 = k * ds + gap, t1 = (k + 1) * ds - gap;
      var c = cA.clone().lerp(cB, n > 1 ? k / (n - 1) : 0);
      if (k === kh && S.lab > 0) c.lerp(new THREE.Color(0xffffff), 0.25 * S.lab);
      for (var i = 0; i < sub; i++) {
        var ta = t0 + (t1 - t0) * i / sub, tb = t0 + (t1 - t0) * (i + 1) / sub;
        [[ta, 0], [tb, 0], [tb, hk], [ta, 0], [tb, hk], [ta, hk]].forEach(function (q) {
          pos.push(Math.cos(q[0]), Math.sin(q[0]), q[1]);
          nor.push(Math.cos(q[0]), Math.sin(q[0]), 0);
          col.push(c.r, c.g, c.b);
        });
      }
      // the top edge of the slab, in ink, so the staircase reads against the
      // red top of the wall
      var top = [];
      for (var j = 0; j <= sub; j++) top.push(onBase(t0 + (t1 - t0) * j / sub, hk));
      tube(top, INK, 0.0065, slabGroup, 0.9);
      // the height it was given: the wall's own height at the left end
      if (n <= 24 && gk >= 1) dot(onBase(k * ds, h[k]), INK, 0.022, slabGroup);
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
    geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    slabGroup.add(new THREE.Mesh(geo, slabMat));

    // the labels on one slab: A_k on its face, ds along its top, and its
    // height beside the edge where it was measured, the edge drawn bright
    if (labOp > 0) {
      var tk = kh * ds, tm = tk + 0.5 * ds, hh = h[kh];
      labA.sprite.position.copy(onBase(tm, 0.3 * hh)).multiplyScalar(0.92);
      labA.sprite.position.z = 0.3 * hh;
      labDs.sprite.position.copy(onBase(tm, hh + 0.2));
      // near the start of C the label runs back over its own slab, so it
      // stays on the wall; elsewhere it reads off to the side of its edge
      labH.sprite.center.set(tk < 0.25 * Math.PI ? 1 : 0, 0.5);
      labH.sprite.position.copy(onBase(tk, 0.75 * hh)).multiplyScalar(0.92);
      labH.sprite.position.z = 0.75 * hh;
      tube([onBase(tk, 0), onBase(tk, hh * clamp01(g * 3 - 2))], INK, 0.011, slabGroup, labOp);
    }
  }

  // ---------- readouts ----------
  var elSum = document.getElementById("sumVal"),
      elName = document.getElementById("nName"),
      elDs = document.getElementById("dsVal"),
      meter = document.getElementById("meter"),
      nSlider = document.getElementById("nSlider");
  var PIECES = [["k1", "m1", "surf"], ["k2", "m2", "base"], ["k3", "m3", "top"]];

  function shownN() { return split ? 2 * split.from : nCur; }
  function paintReadouts() {
    var n = shownN();
    elName.innerHTML = "<i>n</i> = " + n + '<span class="long">' + (n === 1 ? " slab" : " slabs") + "</span>";
    elDs.innerHTML = "<i>n</i> = " + n + ", &nbsp;&Delta;<i>s</i> = " + (n === 1 ? "&pi;" : "&pi;/" + n) +
                     " &asymp; " + (Math.PI / n).toFixed(3);
    elSum.textContent = shownTotal.toFixed(4);
    nSlider.value = String(n);
    PIECES.forEach(function (p) {
      var a = 0.3 + 0.7 * clamp01(S[p[2]]);
      document.getElementById(p[0]).style.opacity = a;
      document.getElementById(p[1]).style.opacity = a;
    });
    var ma = clamp01(S.slabs * 1.5);
    meter.style.opacity = ma;
    meter.style.visibility = ma > 0.01 ? "visible" : "hidden";
    drawPlot();
  }

  // ---------- the little plot: the total for every n, against the wall ----------
  // n runs along a doubling scale, 1, 4, 16, 64 evenly spaced, so the approach
  // is spread across the plot rather than crammed into its first few points.
  var plot = document.getElementById("plot"), pctx = plot.getContext("2d");
  var PW = 176, PH = 66, PL = 7, PR = 9, PT = 8, PB = 15;
  var Y0 = 6.18, Y1 = 7.04, hoverN = 0;
  var LOGMAX = Math.log(NMAX) / Math.LN2;
  function sizePlot() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    plot.width = Math.round(PW * dpr); plot.height = Math.round(PH * dpr);
    plot.style.width = PW + "px"; plot.style.height = PH + "px";
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function px(n) { return PL + (PW - PL - PR) * (Math.log(n) / Math.LN2) / LOGMAX; }
  function py(v) { return PT + (PH - PT - PB) * (Y1 - v) / (Y1 - Y0); }
  function drawPlot() {
    var g = pctx;
    g.clearRect(0, 0, PW, PH);
    // baseline, and n = 1, 4, 16, 64 under it
    g.strokeStyle = "#262a36"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(PL, PH - PB + 0.5); g.lineTo(PW - PR, PH - PB + 0.5); g.stroke();
    g.fillStyle = "#9aa0ad"; g.font = "10.5px " + getComputedStyle(document.body).fontFamily;
    g.textBaseline = "top"; g.textAlign = "center";
    [1, 4, 16, 64].forEach(function (n) { g.fillText(n === 1 ? "n = 1" : String(n), n === 1 ? px(n) + 10 : px(n), PH - PB + 3); });
    // the area of the wall
    g.strokeStyle = "#f0ac5f"; g.lineWidth = 1.5; g.setLineDash([4, 3]);
    g.beginPath(); g.moveTo(PL, py(EXACT)); g.lineTo(PW - PR, py(EXACT)); g.stroke();
    g.setLineDash([]);
    // the totals, n = 1 to 64
    g.strokeStyle = "rgba(88,196,221,0.55)"; g.lineWidth = 2; g.lineJoin = "round"; g.lineCap = "round";
    g.beginPath();
    for (var n = 1; n <= NMAX; n++) {
      if (n === 1) g.moveTo(px(n), py(SUMS[n])); else g.lineTo(px(n), py(SUMS[n]));
    }
    g.stroke();
    // the one on show, with a ring in the surface colour
    var cur = shownN(), cx = split ? px(split.from * Math.pow(2, split.p)) : px(cur);
    ring(cx, py(shownTotal), "#58c4dd");
    if (hoverN && hoverN !== cur) ring(px(hoverN), py(SUMS[hoverN]), "#ece6e2");
    // the value under the pointer, in the empty corner below the curve
    if (hoverN) {
      g.font = "11px " + getComputedStyle(document.body).fontFamily;
      g.textBaseline = "alphabetic"; g.textAlign = "right";
      g.fillStyle = "#ece6e2";
      g.fillText("n = " + hoverN + ":  " + SUMS[hoverN].toFixed(4), PW - PR, PH - PB - 5);
    }
  }
  function ring(x, y, color) {
    var g = pctx;
    g.beginPath(); g.arc(x, y, 6, 0, 2 * Math.PI); g.fillStyle = "#0d0f14"; g.fill();
    g.beginPath(); g.arc(x, y, 4, 0, 2 * Math.PI); g.fillStyle = color; g.fill();
  }
  function plotN(e) {
    var r = plot.getBoundingClientRect();
    var x = (e.clientX - r.left) * PW / r.width;
    var n = Math.round(Math.pow(2, LOGMAX * (x - PL) / (PW - PL - PR)));
    return Math.max(1, Math.min(NMAX, n));
  }
  plot.addEventListener("pointermove", function (e) { hoverN = plotN(e); drawPlot(); });
  plot.addEventListener("pointerleave", function () { hoverN = 0; drawPlot(); });
  plot.addEventListener("click", function (e) { setN(plotN(e)); });

  // ---------- drawing ----------
  function draw() {
    drawSurface();
    drawBase();
    drawTop();
    drawSlabs();
    paintReadouts();
    render();
  }
  function render() { renderer.render(scene, camera); }

  // ---------- timelines: segments played one after another, the tweens in a
  // segment together, each with manim's smooth rate function ----------
  var timeline = null;
  function tw(k, to, dur) { return { key: k, to: to, dur: dur }; }
  function play(segs, done) {
    timeline = { segs: segs, i: -1, done: done };
    nextSeg();
    ensureLoop();
  }
  function nextSeg() {
    var tl = timeline;
    tl.i++;
    if (tl.i >= tl.segs.length) {
      timeline = null;
      draw();
      if (tl.done) tl.done();
      return;
    }
    tl.t = 0; tl.dur = 0;
    tl.items = tl.segs[tl.i].map(function (it) {
      if (it.start) it.start();
      tl.dur = Math.max(tl.dur, it.dur);
      return { key: it.key, to: it.to, dur: Math.max(0.01, it.dur), fn: it.fn,
               from: it.key ? S[it.key] : 0 };
    });
  }
  function stepTimeline(dt) {
    var tl = timeline;
    tl.t += dt;
    tl.items.forEach(function (o) {
      var a = smooth(Math.min(1, tl.t / o.dur));
      if (o.key) S[o.key] = o.from + (o.to - o.from) * a;
      if (o.fn) o.fn(a);
    });
    if (tl.t >= tl.dur) nextSeg();
  }
  // jump to the end of whatever is playing
  function finishTimeline() {
    var tl = timeline;
    if (!tl) return;
    timeline = null;
    tl.items.forEach(function (o) {
      if (o.key) S[o.key] = o.to;
      if (o.fn) o.fn(1);
    });
    for (var i = tl.i + 1; i < tl.segs.length; i++) {
      tl.segs[i].forEach(function (it) {
        if (it.start) it.start();
        if (it.key) S[it.key] = it.to;
        if (it.fn) it.fn(1);
      });
    }
  }

  // double n, each slab splitting in two
  function doubling(dur) {
    return {
      dur: dur,
      start: function () { split = { from: nCur, p: 0 }; },
      fn: function (a) {
        if (!split) return;
        split.p = a;
        if (a >= 1) { nCur = 2 * split.from; split = null; }
      }
    };
  }

  // ---------- the four steps ----------
  // A step button plays that step: whatever comes after it is taken down,
  // whatever comes before it is put up if it is missing, and then the step
  // itself is drawn, so pressing 1, 2, 3, 4 in turn builds the picture, and
  // pressing a step again replays it.
  var activeStep = 4;
  var DUR = { surf: 2.2, base: 2.4, top: 3.4, slabs: 2.0 };
  function stepSegs(k) {
    var segs = [], down = [];
    if (S.lab > 0 && k < 4) down.push(tw("lab", 0, 0.3));
    if (S.slabs > 0) down.push(tw("slabs", 0, 0.5));
    if (k <= 3) {
      if (S.dim > 0) down.push(tw("dim", 0, 0.5));
      if (S.fade > 0) down.push(tw("fade", 0, 0.5));
      if (S.top > 0) down.push(tw("top", 0, 0.5));
    }
    if (k <= 2 && S.base > 0) down.push(tw("base", 0, 0.5));
    if (k <= 1 && S.surf > 0) down.push(tw("surf", 0, 0.6));
    if (down.length) segs.push(down);
    if (k >= 2 && S.surf < 1) segs.push([tw("surf", 1, 1.2)]);
    if (k >= 3 && S.base < 1) segs.push([tw("base", 1, 1.2)]);
    if (k >= 4 && S.top < 1) segs.push([tw("top", 1, 1.6)]);
    if (k === 1) segs.push([tw("surf", 1, DUR.surf)]);
    if (k === 2) segs.push([tw("base", 1, DUR.base)]);
    if (k === 3) segs.push([tw("top", 1, DUR.top)]);
    if (k === 4) segs.push([tw("dim", 1, 0.7), tw("fade", 1, 0.7)], [tw("slabs", 1, DUR.slabs)]);
    return segs;
  }
  function stepTo(k) {
    if (tour.running) stopTour();
    finishTimeline();
    split = null;
    activeStep = k;
    paintSteps();
    play(stepSegs(k));
  }
  var STEP_BTNS = ["btnS1", "btnS2", "btnS3", "btnS4"].map(function (id) { return document.getElementById(id); });
  function paintSteps() {
    STEP_BTNS.forEach(function (b, i) {
      b.classList.toggle("active", activeStep === i + 1);
      b.classList.toggle("done", i + 1 < activeStep);
    });
  }
  STEP_BTNS.forEach(function (b, i) {
    b.addEventListener("click", function () { stepTo(i + 1); });
  });

  // ---------- n ----------
  function setN(n) {
    if (tour.running) stopTour();
    if (timeline && S.slabs >= 1) finishTimeline();
    split = null;
    nCur = n;
    if (S.slabs < 1 && !(timeline && activeStep === 4)) {
      // the slabs are not up yet: bring in whatever is missing, quickly
      finishTimeline();
      activeStep = 4;
      paintSteps();
      play([[tw("surf", 1, 0.7), tw("base", 1, 0.7), tw("top", 1, 0.7),
             tw("dim", 1, 0.7), tw("fade", 1, 0.7)], [tw("slabs", 1, 0.9)]]);
    }
    draw();
  }
  nSlider.addEventListener("input", function () { setN(parseInt(nSlider.value, 10)); });

  var btnLabel = document.getElementById("btnLabel");
  var labelOn = false;
  function setLabel(on, dur) {
    labelOn = on;
    btnLabel.classList.toggle("active", on);
    if (timeline) { S.lab = on ? 1 : 0; draw(); return; }
    play([[tw("lab", on ? 1 : 0, dur === undefined ? 0.4 : dur)]]);
  }
  btnLabel.addEventListener("click", function () {
    if (tour.running) stopTour();
    setLabel(!labelOn);
    if (labelOn && S.slabs < 1) setN(nCur);
  });

  // ---------- render loop ----------
  var spinning = false, rafId = null, lastT = 0, tourClock = 0;
  function frame(now) {
    rafId = requestAnimationFrame(frame);
    var dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0;
    lastT = now;
    var moved = false;
    if (spinning) { theta += 0.22 * dt; moved = true; }
    else if (tour.running) {
      // during the tour the view sways a little, so the wall reads as solid,
      // but it always looks at the wall from the front
      tourClock += dt;
      theta = THETA0 + 0.32 * Math.sin(0.33 * tourClock);
      moved = true;
    }
    if (moved) placeCamera();
    if (timeline) { stepTimeline(dt); draw(); }
    else if (moved) render();
    if (!spinning && !tour.running && !timeline) {
      cancelAnimationFrame(rafId); rafId = null; lastT = 0;
    }
  }
  function ensureLoop() { if (rafId === null) { lastT = 0; rafId = requestAnimationFrame(frame); } }

  // ---------- the guided tour ----------
  var elCaption = document.getElementById("caption");
  function say(text) {
    elCaption.classList.remove("show");
    window.setTimeout(function () {
      elCaption.innerHTML = text;
      elCaption.classList.add("show");
    }, text ? 160 : 0);
  }
  function wait(dur) { return { dur: dur }; }

  // the captions are HTML, for the subscripts
  var TK = "<i>t<sub>k</sub></i>", FK = "<i>f</i>(<i>x</i>(" + TK + "), <i>y</i>(" + TK + "))";
  var STORY = [
    { say: "Start with the graph of <i>f</i>(<i>x</i>, <i>y</i>) = 2 + <i>x</i>²<i>y</i>: a surface above the <i>xy</i>-plane.",
      segs: function () { return stepSegs(1); }, hold: 1.8 },
    { say: "The base of the wall is the curve <i>C</i> on the floor: the upper half of the circle <i>x</i>² + <i>y</i>² = 1, from (1, 0) to (−1, 0).",
      segs: function () { return stepSegs(2); }, hold: 1.8 },
    { say: "Travel along <i>C</i>, and at each point (<i>x</i>, <i>y</i>) go straight up to the surface. The top of the wall is the curve on the graph directly above <i>C</i>.",
      segs: function () { return stepSegs(3); }, hold: 1.6 },
    { say: "So the wall stands on <i>C</i>, and above the point (<i>x</i>, <i>y</i>) it is <i>f</i>(<i>x</i>, <i>y</i>) tall. What is its area?",
      segs: function () { return [[wait(0.1)]]; }, hold: 2.8 },
    { say: "Cut <i>C</i> into <i>n</i> pieces of length Δ<i>s</i>, and over the <i>k</i>th piece stand a slab of constant height " + FK + ", the height of the wall at the left end of the piece.",
      segs: function () {
        return [[{ dur: 0.01, start: function () { nCur = 4; } }]].concat(stepSegs(4),
          [[tw("lab", 1, 0.5)]]);
      }, hold: 3.2 },
    { say: "The <i>k</i>th slab has area <i>A<sub>k</sub></i> = " + FK + " Δ<i>s</i>, and together the slabs approximate the wall: <i>A</i> ≈ Σ " + FK + " Δ<i>s</i>.",
      segs: function () { return [[wait(0.1)]]; }, hold: 3.6 },
    { say: "More slabs, thinner slabs: their tops hug the top of the wall more and more closely...",
      segs: function () { return [[tw("lab", 0, 0.4)], [doubling(1.3)], [wait(0.5)], [doubling(1.3)]]; }, hold: 1.2 },
    { say: "...and the total area of the slabs closes in on the area of the wall, 2π + 2/3 ≈ 6.9499.",
      segs: function () { return [[doubling(1.2)], [wait(0.4)], [doubling(1.2)]]; }, hold: 2.4 },
    { say: "In the limit, <i>A</i> = lim<sub><i>n</i>→∞</sub> Σ " + FK + " Δ<i>s</i> = ∫<sub><i>C</i></sub> <i>f</i>(<i>x</i>, <i>y</i>) <i>ds</i>: the line integral is the area of the wall.",
      segs: function () { return [[wait(0.1)]]; }, hold: 3.2 },
    { say: "Your turn: build the wall step by step with the buttons, drag <i>n</i>, or drag the figure to look from anywhere.",
      segs: function () {
        return [[{ dur: 0.01, start: function () { nCur = 8; } }]];
      }, hold: 1.4 }
  ];

  var tour = { running: false, i: 0, timer: null };
  var btnTour = document.getElementById("btnTour");

  function tourStep() {
    if (!tour.running) return;
    if (tour.i >= STORY.length) { stopTour(); return; }
    var beat = STORY[tour.i++];
    say(beat.say);
    if (tour.i <= 5) { activeStep = Math.min(4, tour.i); paintSteps(); }
    play(beat.segs(), function () {
      if (!tour.running) return;
      tour.timer = window.setTimeout(tourStep, beat.hold * 1000);
    });
  }
  function startTour() {
    finishTimeline();
    split = null;
    if (labelOn) { labelOn = false; btnLabel.classList.remove("active"); }
    if (spinning) { spinning = false; btnSpin.classList.remove("active"); }
    tour.running = true; tour.i = 0; tourClock = 0;
    btnTour.innerHTML = '&#10074;&#10074;<span class="long">&nbsp;Stop</span>';
    btnTour.setAttribute("aria-label", "Stop the tour");
    btnTour.classList.add("running");
    nSlider.disabled = true; nSlider.style.opacity = "0.45";
    ensureLoop();
    tourStep();
  }
  function stopTour() {
    tour.running = false;
    if (tour.timer) { window.clearTimeout(tour.timer); tour.timer = null; }
    finishTimeline();
    split = null;
    S.lab = labelOn ? 1 : 0;
    btnTour.innerHTML = '&#9654;<span class="long">&nbsp;Play</span>';
    btnTour.setAttribute("aria-label", "Play the guided tour");
    btnTour.classList.remove("running");
    nSlider.disabled = false; nSlider.style.opacity = "1";
    say("");
    draw();
  }
  btnTour.addEventListener("click", function () { tour.running ? stopTour() : startTour(); });

  // ---------- drag to orbit ----------
  var dragging = false, lastX = 0, lastY = 0;
  var el = renderer.domElement;
  function startDrag(x, y) { dragging = true; lastX = x; lastY = y; }
  function moveDrag(x, y) {
    if (!dragging) return;
    theta -= (x - lastX) * 0.008;
    phi = Math.min(Math.PI - 0.05, Math.max(0.05, phi - (y - lastY) * 0.008));
    lastX = x; lastY = y;
    if (tour.running) THETA0 = theta - 0.32 * Math.sin(0.33 * tourClock);
    placeCamera();
    render();
  }
  el.addEventListener("mousedown", function (e) { startDrag(e.clientX, e.clientY); });
  window.addEventListener("mousemove", function (e) { moveDrag(e.clientX, e.clientY); });
  window.addEventListener("mouseup", function () { dragging = false; });
  el.addEventListener("touchstart", function (e) {
    if (e.touches.length === 1) { startDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, { passive: false });
  el.addEventListener("touchmove", function (e) {
    if (e.touches.length === 1) { moveDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
  }, { passive: false });
  window.addEventListener("touchend", function () { dragging = false; });

  var btnSpin = document.getElementById("btnSpin");
  btnSpin.addEventListener("click", function () {
    if (tour.running) stopTour();
    spinning = !spinning;
    btnSpin.classList.toggle("active", spinning);
    if (spinning) ensureLoop();
  });

  // ---------- full screen ----------
  // The figure lives in an iframe, so the request is only honoured when the
  // embedding iframe carries allowfullscreen (custom-html.xsl adds it for
  // interactive/@iframe). Where it is refused anyway, iOS Safari for one, the
  // page opens on its own in a new tab instead.
  var btnFull = document.getElementById("btnFull");
  var docEl = document.documentElement;
  function fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  function openStandalone() { window.open(window.location.href, "_blank", "noopener"); }
  btnFull.addEventListener("click", function () {
    if (fsElement()) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      return;
    }
    var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
    if (!req) { openStandalone(); return; }
    try {
      var p = req.call(docEl);
      if (p && p.catch) p.catch(openStandalone);
    } catch (e) { openStandalone(); }
  });
  function onFsChange() {
    var on = !!fsElement();
    btnFull.classList.toggle("active", on);
    btnFull.innerHTML = '&#x26F6;<span class="long">&nbsp;' + (on ? "Exit full screen" : "Full screen") + "</span>";
    btnFull.setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
    window.setTimeout(resize, 50);
  }
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);

  // ---------- what has to fit on screen ----------
  // Measured off the finished scene with everything up and the slabs at their
  // tallest (a single slab), then again with the labels on a slab where they
  // sit for most n, so the frame that holds those pictures holds every other.
  function fitScene() {
    var saveS = {}, saveN = nCur, saveSplit = split, pts = [], anchors = [];
    Object.keys(S).forEach(function (k) { saveS[k] = S[k]; S[k] = 1; });
    split = null;
    function collect(labelsOnly) {
      drawSurface(); drawBase(); drawTop(); drawSlabs();
      scene.updateMatrixWorld(true);
      scene.traverse(function (o) {
        if (o.visible === false) return;
        if (labelsOnly && !o.isSprite) return;
        if (o.isSprite) {
          anchors.push({ p: o.position.clone(), cx: o.center.x, cy: o.center.y,
                         w: o.scale.x, h: o.scale.y });
          return;
        }
        var at = o.geometry && o.geometry.getAttribute && o.geometry.getAttribute("position");
        if (!at) return;
        var step = Math.max(1, Math.floor(at.count / 400));
        for (var i = 0; i < at.count; i += step) {
          pts.push(new THREE.Vector3(at.getX(i), at.getY(i), at.getZ(i)).applyMatrix4(o.matrixWorld));
        }
      });
    }
    nCur = 1; S.lab = 0; collect(false);
    nCur = 8; S.lab = 1; collect(true);
    var box = new THREE.Box3();
    pts.forEach(function (p) { box.expandByPoint(p); });
    anchors.forEach(function (a) { box.expandByPoint(a.p); });
    box.getCenter(CENTER);
    CLOUD = pts.map(function (p) { return p.clone().sub(CENTER); });
    SPRITES = anchors.map(function (a) { a.p.sub(CENTER); return a; });
    Object.keys(saveS).forEach(function (k) { S[k] = saveS[k]; });
    nCur = saveN; split = saveSplit;
  }

  // ---------- sizing ----------
  function resize() {
    var w = document.getElementById("app").clientWidth;
    var h = stage.clientHeight;
    var card = document.getElementById("eqcard");
    var stacked = window.getComputedStyle(card).position === "static";
    var cardH = stacked ? card.offsetHeight : 0;
    var ch = Math.max(120, h - cardH);

    renderer.setSize(w, ch);
    camera.aspect = w / ch;

    var reach = function (e) { return Math.min(1, e.offsetWidth / (0.45 * w)); };
    var topPad = stacked ? 0 : (card.offsetHeight + 20) * reach(card);
    var botPad = (meter.offsetHeight + 20) * reach(meter);
    band = Math.max(0.34, (ch - topPad - botPad) / ch);
    aspect = camera.aspect;
    aimShift = 0.5 * (topPad - botPad) / ch;
    elCaption.style.bottom = (meter.offsetHeight + 22) + "px";

    placeCamera();
    draw();
  }
  window.addEventListener("resize", resize);

  // ---------- go ----------
  sizePlot();
  paintSteps();
  fitScene();
  resize();

  // once PT Serif has arrived the labels are repainted in it, and the frame is
  // measured again, since their widths have changed
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      LABELS.forEach(paintLabel);
      fitScene();
      resize();
    });
  }
})();
</script>
</body>
</html>
